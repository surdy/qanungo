<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>qanungo — practice, cost, standup</title>
<style>
/*
 * One file, no assets, no fonts, no network but this server's own two routes.
 *
 * Colours are roles, defined once for light and re-defined once for dark, so the
 * page follows the reader's system setting on a laptop, a phone, and a TV without
 * asking anybody to choose. Sizes are clamped against the viewport rather than
 * fixed: the same page has to be legible held in one hand and across a room.
 */
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --rule: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --up: #006300;
  --down: #d03b3b;
  --warn-surface: #fdf3d8;
  --warn-ink: #5c4405;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --rule: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --up: #0ca30c;
    --down: #d03b3b;
    --warn-surface: #2e2611;
    --warn-ink: #fab219;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: clamp(1rem, 3vw, 3rem);
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: clamp(15px, 0.45vw + 13px, 22px);
  line-height: 1.5;
}
main { max-width: 1600px; margin: 0 auto; }
h1 {
  font-size: clamp(1.35rem, 1.6vw + 0.9rem, 2.2rem);
  font-weight: 650;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}
h2 {
  font-size: 1.05rem;
  font-weight: 650;
  margin: 2.5rem 0 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
}
p { margin: 0 0 0.5rem; }
.sub { color: var(--ink-2); margin: 0 0 1.5rem; }
.banner {
  display: none;
  margin: 0 0 1.5rem;
  padding: 0.7rem 1rem;
  border-radius: 8px;
  background: var(--warn-surface);
  color: var(--warn-ink);
  border: 1px solid var(--border);
}
.banner.shown { display: block; }

/* Five tiles. auto-fit rather than a fixed count: one column on a phone, five
   across a TV, and nothing reflows into a half-empty row in between. */
.tiles {
  display: grid;
  gap: clamp(0.75rem, 1vw, 1.25rem);
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
  /* Each tile is as tall as its own contents. Stretching them to match would let one
     lane's explanation of why it is not scored decide the height of the four beside it. */
  align-items: start;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.9rem, 1.2vw, 1.4rem);
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.tile-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-2);
  text-transform: none;
}
.tile-value {
  font-size: clamp(2.4rem, 3.4vw, 3.6rem);
  font-weight: 650;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.tile-value.unscored {
  font-size: clamp(1rem, 1.2vw, 1.35rem);
  font-weight: 600;
  color: var(--ink-muted);
  line-height: 1.6;
  padding: 0.9rem 0;
}
.delta { font-size: 0.9rem; font-weight: 600; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat, .delta.none { color: var(--ink-muted); font-weight: 500; }
.split {
  margin-top: 0.35rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.split-row {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.85rem;
}
.split-name { color: var(--ink-2); white-space: nowrap; }
.split-score { font-variant-numeric: tabular-nums; white-space: nowrap; }
.reason { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--ink-muted); }

details { margin-top: 0.5rem; }
summary {
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--ink-2);
  padding: 0.2rem 0;
}
.readings { margin: 0.4rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--ink-2); }
.readings li { margin-bottom: 0.25rem; }

.finding {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.9rem, 1.2vw, 1.4rem);
  margin-bottom: clamp(0.75rem, 1vw, 1.25rem);
}
.finding h3 {
  font-size: 1.05rem;
  font-weight: 650;
  margin: 0 0 0.1rem;
}
.finding-count { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 0.75rem; }
.finding dt {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 0.6rem;
}
.finding dd { margin: 0.15rem 0 0; color: var(--ink-2); max-width: 68ch; }
.hashes {
  margin: 0.4rem 0 0;
  padding: 0;
  list-style: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  color: var(--ink-2);
  max-height: 16rem;
  overflow-y: auto;
  overflow-x: auto;
}
.empty { color: var(--ink-2); }

/* Evidence. A finding's sessions are a scrolling column of collapsed rows; opening one
   is what fetches it, so a window with sixty firing sessions costs sixty summaries and
   nothing else until somebody asks. */
.sessions { margin-top: 0.4rem; max-height: 24rem; overflow-y: auto; }
.session { border-top: 1px solid var(--rule); }
.session > summary {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}
.excerpt {
  margin: 0.35rem 0 0.6rem;
  padding: 0.5rem 0.7rem;
  border-left: 3px solid var(--rule);
  font-size: 0.82rem;
}
.excerpt-where {
  color: var(--ink-muted);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
}
.excerpt-field {
  margin: 0.25rem 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 14rem;
  overflow-y: auto;
}
.excerpt-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 0.4rem;
}
.excerpt.failed { border-left-color: var(--down); }
.excerpt-note { color: var(--ink-muted); font-size: 0.75rem; margin-top: 0.3rem; }

/* Structural evidence: the shape of the work, drawn from timestamps only. */
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.25rem;
  margin: 0.4rem 0 0.5rem;
  font-size: 0.82rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.sitting-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.2rem;
  font-size: 0.75rem;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}
.sitting-when { white-space: nowrap; }
.sitting-track { flex: 1 1 6rem; min-width: 4rem; height: 0.55rem; background: var(--rule); border-radius: 3px; }
.sitting-bar { height: 100%; background: var(--ink-2); border-radius: 3px; min-width: 2px; }

/* The cost section. A headline, then tables — which are the honest shape for a
   priced breakdown and the one the CLI already uses, so a reader comparing the two
   is comparing rows to rows. Each table scrolls inside its own box rather than
   letting the page scroll sideways on a phone. */
.headline {
  font-size: clamp(1.6rem, 2.4vw, 2.4rem);
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0 0 0.2rem;
}
.headline-sub { color: var(--ink-2); margin: 0 0 0.75rem; }
.note { color: var(--ink-2); font-size: 0.85rem; max-width: 78ch; margin: 0 0 0.75rem; }
.scroller { overflow-x: auto; margin: 0.75rem 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
caption {
  caption-side: top;
  text-align: left;
  font-weight: 650;
  padding-bottom: 0.35rem;
}
th, td {
  padding: 0.35rem 0.7rem 0.35rem 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  white-space: nowrap;
}
th { color: var(--ink-muted); font-weight: 600; font-size: 0.78rem; }
td.figure, th.figure { text-align: right; font-variant-numeric: tabular-nums; }
td.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
.flags { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--ink-2); }
.flags li { margin-bottom: 0.3rem; max-width: 78ch; }

/* The standup section: the archive's own prose, scrubbed. Sessions read like a
   document rather than a dashboard, because that is what they are. */
.repo { margin-bottom: 1.75rem; }
.repo h3 {
  font-size: 0.95rem;
  font-weight: 650;
  margin: 0 0 0.6rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.8rem, 1.1vw, 1.2rem);
  margin-bottom: 0.6rem;
}
.session-card h4 { font-size: 1rem; font-weight: 650; margin: 0 0 0.2rem; max-width: 78ch; }
.session-meta {
  font-size: 0.75rem;
  color: var(--ink-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap: anywhere;
  margin-bottom: 0.5rem;
}
.session-goal { color: var(--ink-2); max-width: 78ch; margin: 0 0 0.4rem; }
.work { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; color: var(--ink-2); }
.work li { margin-bottom: 0.2rem; max-width: 78ch; }
.rollup { margin: 0.4rem 0 0; padding-left: 1.1rem; }
.rollup li { margin-bottom: 0.35rem; max-width: 78ch; }
.rollup .where {
  color: var(--ink-muted);
  font-size: 0.78rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.82rem;
  color: var(--ink-muted);
}
footer p { margin: 0 0 0.3rem; max-width: 100ch; }
footer .archive { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Practice scores</h1>
  <p class="sub" id="subtitle">Loading the fold…</p>
  <div class="banner" id="banner"></div>

  <section aria-labelledby="lanes-heading">
    <h2 id="lanes-heading">Five lanes</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section aria-labelledby="findings-heading">
    <h2 id="findings-heading">Findings</h2>
    <div id="findings"></div>
  </section>

  <section aria-labelledby="cost-heading">
    <h2 id="cost-heading">Cost</h2>
    <div id="cost"></div>
  </section>

  <section aria-labelledby="standup-heading">
    <h2 id="standup-heading">Standup</h2>
    <div id="standup"></div>
  </section>

  <footer id="provenance"></footer>
</main>
<script>
"use strict";
/*
 * Everything the payload carries is written with textContent, never as markup.
 * Harness labels come out of somebody else's manifest and are already clamped
 * server-side; setting them as text rather than parsing them is the second half
 * of that discipline. No string in this file is ever assigned to a property that
 * would parse it as markup — the elements below are built and their text set.
 *
 * It also contains no links. Patwari serves unredacted blobs, so a deep link
 * from this page into the archive would hand every tailnet device a whole
 * transcript. The only evidence this page can expand is what the payload itself
 * named — one scrubbed event per anchor, from this server's own route — and a
 * whole session is still a hash you take to your own shell.
 */
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};

let generation = null;

function banner(message) {
  const node = document.getElementById("banner");
  node.textContent = message || "";
  node.classList.toggle("shown", Boolean(message));
}

function deltaNode(trend) {
  if (!trend) {
    return el("div", "delta none", "no comparable window");
  }
  if (trend.direction === "flat") {
    return el("div", "delta flat", "= unchanged from " + trend.was);
  }
  const word = trend.direction === "up" ? "up" : "down";
  return el(
    "div",
    "delta " + trend.direction,
    trend.glyph + " " + word + " " + trend.points + " from " + trend.was
  );
}

function scoreText(entry) {
  if (entry.state === "scored") return String(entry.score);
  if (entry.state === "no-reading") return "no reading";
  if (entry.state === "no-sessions") return "no sessions";
  return "not scored";
}

function laneTile(lane) {
  const tile = el("div", "tile");
  tile.appendChild(el("div", "tile-label", lane.title));

  const fleet = lane.fleet;
  const scored = fleet.state === "scored";
  tile.appendChild(el("div", "tile-value" + (scored ? "" : " unscored"), scoreText(fleet)));
  if (scored) tile.appendChild(deltaNode(fleet.trend));

  const split = el("div", "split");
  for (const harness of lane.harnesses) {
    const row = el("div", "split-row");
    row.appendChild(el("span", "split-name", harness.source_agent));
    let right = scoreText(harness);
    if (harness.state === "scored" && harness.trend) {
      right += " " + harness.trend.glyph;
      if (harness.trend.direction !== "flat") right += " " + harness.trend.points;
    }
    if (harness.sessions) right += " · " + harness.sessions + " sessions";
    row.appendChild(el("span", "split-score", right));
    split.appendChild(row);
  }
  if (lane.harnesses.length) tile.appendChild(split);

  // The sentence naming the pull that would light an unfed lane up is the whole content of
  // "not scored", so it belongs behind the same disclosure a score's readings do — otherwise
  // one lane's paragraph is the loudest thing on the page.
  if (lane.reason) {
    const details = el("details");
    details.appendChild(el("summary", null, "Why it is not scored"));
    details.appendChild(el("p", "reason", lane.reason));
    tile.appendChild(details);
  }

  const readings = lane.harnesses.flatMap((harness) =>
    (harness.components || []).map((component) => ({ harness, component }))
  );
  if (readings.length) {
    const details = el("details");
    details.appendChild(el("summary", null, "Why this score"));
    const list = el("ul", "readings");
    for (const { harness, component } of readings) {
      const cost =
        component.cost === null || component.cost === undefined
          ? "no say in the score"
          : component.cost.toFixed(1) + " points off";
      list.appendChild(
        el(
          "li",
          null,
          harness.source_agent + " — " + component.label + ": " + component.detail + " — " + cost
        )
      );
    }
    details.appendChild(list);
    tile.appendChild(details);
  }
  return tile;
}

/* One excerpt, as the server scrubbed it. Every field is set as text: the markers a
   redactor leaves are shown as they are, because a reader has to be able to see that
   the scrub fired. */
function excerptNode(excerpt) {
  const node = el("div", "excerpt" + (excerpt.outcome === false ? " failed" : ""));
  const where = [
    excerpt.tool || "unattributed tool",
    excerpt.event,
    excerpt.at,
    "record " + excerpt.record,
    "line " + excerpt.line,
  ]
    .filter(Boolean)
    .join(" · ");
  node.appendChild(el("div", "excerpt-where", where));
  for (const [label, value] of [
    ["Command", excerpt.command],
    ["Error", excerpt.error],
    ["Output", excerpt.output],
  ]) {
    if (value === null || value === undefined || value === "") continue;
    node.appendChild(el("div", "excerpt-label", label));
    node.appendChild(el("pre", "excerpt-field", value));
  }
  const notes = [];
  if (!excerpt.command && !excerpt.error && !excerpt.output) {
    notes.push("this event carried no command, error, or output of its own");
  }
  if (excerpt.truncated) notes.push("cut to fit; the transcript has the rest");
  if (excerpt.redaction.total) {
    notes.push(
      excerpt.redaction.total +
        " redacted (" +
        excerpt.redaction.fired.map((fired) => fired.pattern + " ×" + fired.count).join(", ") +
        ")"
    );
  } else if (!excerpt.redaction.secrets) {
    notes.push("served raw — this dashboard was started with --no-redact");
  }
  if (notes.length) node.appendChild(el("div", "excerpt-note", notes.join(" · ")));
  return node;
}

/* Structural evidence: what a session-shaped rule actually measured. Timestamps and
   counts, and a bar per sitting scaled against the longest one in the same session. */
function structuralNode(structural) {
  const node = el("div");
  const stats = el("div", "stats");
  const pairs = [
    ["active", structural.active.rendered],
    ["span", structural.span.rendered],
    ["longest sitting", structural.longest_sitting.rendered],
    ["sittings", structural.sittings],
    ["user requests", structural.user_requests],
    ["assistant messages", structural.assistant_messages],
    ["tool activities", structural.tool_activities],
  ];
  for (const [label, value] of pairs) {
    if (value === null || value === undefined) continue;
    stats.appendChild(el("span", null, label + " " + value));
  }
  node.appendChild(stats);

  const longest = structural.boundaries.reduce(
    (most, sitting) => Math.max(most, sitting.seconds),
    0
  );
  for (const sitting of structural.boundaries) {
    const row = el("div", "sitting-row");
    row.appendChild(el("span", "sitting-when", sitting.from + " → " + sitting.to));
    const track = el("div", "sitting-track");
    const bar = el("div", "sitting-bar");
    bar.style.width = (longest > 0 ? (sitting.seconds / longest) * 100 : 0) + "%";
    track.appendChild(bar);
    row.appendChild(track);
    row.appendChild(el("span", "sitting-when", sitting.rendered));
    node.appendChild(row);
  }
  if (structural.boundaries_elided > 0) {
    node.appendChild(
      el(
        "div",
        "excerpt-note",
        structural.boundaries_elided + " further sittings are counted above and not drawn"
      )
    );
  }
  return node;
}

async function loadExcerpts(into, sourceHash, anchors) {
  into.replaceChildren(el("div", "excerpt-note", "Fetching " + anchors.length + " excerpts…"));
  const nodes = [];
  for (const anchor of anchors) {
    try {
      const response = await fetch("/api/evidence/" + sourceHash + "/" + anchor.locator, {
        cache: "no-store",
      });
      const body = await response.json();
      if (!response.ok) {
        nodes.push(el("div", "excerpt-note", "No excerpt for " + anchor.locator + ": " + body.detail));
        continue;
      }
      nodes.push(excerptNode(body));
    } catch (error) {
      nodes.push(el("div", "excerpt-note", "Could not fetch the excerpt: " + error.message));
    }
  }
  into.replaceChildren(...nodes);
}

/* One cited session. Collapsed until asked for, and what asking costs is bounded: the
   payload already said which events this row can show, and the server will resolve no
   others. */
function sessionRow(finding, evidence) {
  const row = el("details", "session");
  const anchors = evidence.anchors || [];
  const label =
    "sha256:" +
    evidence.source_hash +
    (anchors.length ? " — " + anchors.length + " counted events" : "");
  row.appendChild(el("summary", null, label));
  const body = el("div");
  if (evidence.structural) body.appendChild(structuralNode(evidence.structural));
  if (anchors.length) {
    const excerpts = el("div");
    body.appendChild(excerpts);
    let fetched = false;
    row.addEventListener("toggle", () => {
      if (!row.open || fetched) return;
      fetched = true;
      loadExcerpts(excerpts, evidence.source_hash, anchors);
    });
  } else if (finding.evidence_kind !== "structural") {
    body.appendChild(
      el(
        "div",
        "excerpt-note",
        "This session's events are counted but not anchored — the fold's per-session anchor " +
          "budget was already spent. The counts above are unaffected."
      )
    );
  }
  row.appendChild(body);
  return row;
}

const EVIDENCE_KIND = {
  event: "the events it counted",
  structural: "what it measured — timestamps and counts, never an utterance",
  // Kind-neutral on purpose: two rules are Mixed and their halves differ. Fire-and-forget
  // anchors failures beside a ratio; unreviewed-ship anchors commits beside an absence.
  mixed: "the events it anchored, and the shape it measured",
};

function findingCard(finding, folded) {
  const card = el("div", "finding");
  card.appendChild(el("h3", null, finding.title));
  card.appendChild(
    el(
      "div",
      "finding-count",
      finding.sessions_affected + " of " + folded + " folded sessions · rule " + finding.rule
    )
  );
  const list = el("dl");
  list.appendChild(el("dt", null, "Problem"));
  list.appendChild(el("dd", null, finding.problem));
  list.appendChild(el("dt", null, "Action"));
  list.appendChild(el("dd", null, finding.action));
  card.appendChild(list);

  const details = el("details");
  details.appendChild(
    el(
      "summary",
      null,
      "Evidence — " +
        finding.evidence.length +
        " sessions, showing " +
        (EVIDENCE_KIND[finding.evidence_kind] || "what the rule saw")
    )
  );
  const sessions = el("div", "sessions");
  for (const evidence of finding.evidence) {
    sessions.appendChild(sessionRow(finding, evidence));
  }
  details.appendChild(sessions);
  card.appendChild(details);
  return card;
}

/* A table, built element by element and filled with textContent. `columns` names each
   heading and whether it is a figure; `rows` is an array of cell values already
   rendered server-side, because how a dollar or a token count reads is format.rs's
   job and a second implementation of it here would drift from the CLI. */
function table(caption, columns, rows) {
  const scroller = el("div", "scroller");
  const node = el("table");
  if (caption) node.appendChild(el("caption", null, caption));
  const head = el("tr");
  for (const column of columns) {
    head.appendChild(el("th", column.figure ? "figure" : null, column.label));
  }
  const thead = el("thead");
  thead.appendChild(head);
  node.appendChild(thead);
  const body = el("tbody");
  for (const row of rows) {
    const tr = el("tr");
    row.forEach((value, index) => {
      const column = columns[index];
      const className = column.figure ? "figure" : column.name ? "name" : null;
      tr.appendChild(el("td", className, value));
    });
    body.appendChild(tr);
  }
  node.appendChild(body);
  scroller.appendChild(node);
  return scroller;
}

/* The cost delta, in the three states the payload can be in. ▲ is more money, which
   is a direction and not a verdict — the sentence says so, exactly as the report does. */
function costComparison(comparison, window) {
  if (comparison.state === "no-window") {
    return el("p", "note", "No comparison: " + window + " is too long to place an equal-length window before it.");
  }
  if (comparison.state === "nothing-priced") {
    return el(
      "p",
      "note",
      "No comparison: the archive holds no priced session in the equal-length window before this one, which opened " +
        comparison.opens_at +
        " (UTC)."
    );
  }
  const node = el("p", "delta " + comparison.direction);
  node.textContent =
    comparison.glyph +
    " " +
    comparison.delta_rendered +
    " against the equal-length window before it — " +
    comparison.was_rendered +
    " across " +
    comparison.was_sessions +
    " sessions, from " +
    comparison.opens_at +
    " (UTC). ▲ is more money, not a worse window.";
  return node;
}

function costSection(cost) {
  const nodes = [];
  const priced = cost.priced;

  if (priced.priced_anything) {
    nodes.push(el("p", "headline", priced.dollars_rendered));
    nodes.push(
      el(
        "p",
        "headline-sub",
        "across " +
          priced.sessions +
          " claude-code sessions and " +
          priced.messages +
          " billed messages, archived in the last " +
          cost.window.last +
          " since " +
          cost.window.opens_at +
          " (UTC)."
      )
    );
    nodes.push(
      el(
        "p",
        "note",
        "Anthropic API list prices, at the rates in force when each session was archived (price " +
          "table " +
          cost.price_table_revision +
          "). The archive knows which model answered and how many tokens it read and wrote; it " +
          "does not know the account's billing plan, so this is what the usage would list at and " +
          "not necessarily what was charged for it."
      )
    );
    nodes.push(costComparison(cost.comparison, cost.window.last));
  } else {
    nodes.push(
      el(
        "p",
        "empty",
        "No claude-code session in the last " +
          cost.window.last +
          " carried usage this build could price. What the archive did record is below."
      )
    );
  }

  if (cost.by_model.length) {
    nodes.push(
      table(
        null,
        [
          { label: "Model", name: true },
          { label: "Messages", figure: true },
          { label: "Input", figure: true },
          { label: "Output", figure: true },
          { label: "Cache write 5m", figure: true },
          { label: "Cache write 1h", figure: true },
          { label: "Cache read", figure: true },
          { label: "Cost", figure: true },
        ],
        cost.by_model.map((row) => [
          row.model,
          row.messages,
          row.tokens.input.rendered,
          row.tokens.output.rendered,
          row.tokens.cache_write_5m.rendered,
          row.tokens.cache_write_1h.rendered,
          row.tokens.cache_read.rendered,
          row.dollars_rendered,
        ])
      )
    );
  }

  if (cost.caching) {
    let sentence =
      cost.caching.read.rendered +
      " tokens were served from the prompt cache for " +
      cost.caching.read_dollars_rendered +
      ". Sending them as fresh input would have cost " +
      cost.caching.at_input_rate_rendered +
      ", so caching saved " +
      cost.caching.saving_rendered +
      ".";
    if (cost.caching.write_5m || cost.caching.write_1h) {
      sentence +=
        " The writes that filled it are already inside the total above, so this is the read side" +
        " alone and is not net of them.";
    }
    nodes.push(el("p", "note", sentence));
  }

  if (cost.by_repository.length) {
    nodes.push(
      table(
        "By repository",
        [
          { label: "Repository", name: true },
          { label: "Messages", figure: true },
          { label: "Tokens", figure: true },
          { label: "Cost", figure: true },
        ],
        cost.by_repository.map((row) => [
          row.repository === null ? "(no repository)" : row.repository,
          row.messages,
          row.tokens.total.rendered,
          row.dollars_rendered,
        ])
      )
    );
  }

  /* Copilot. The payload hands this page token volumes and no money at all — there is
     no dollar figure here to render, and none is invented. The label says so rather
     than leaving a reader to wonder why one column is missing. */
  if (cost.copilot.rows.length) {
    nodes.push(
      el(
        "p",
        "note",
        "Copilot records output tokens only — one figure per assistant message, with no " +
          "per-message input, cache, or tier — and a transcript does not say whether the account " +
          "was on premium requests or on usage-based credits. These rows are token volumes: no " +
          "dollars, no credit estimate, no premium-request count, and they are not in the total " +
          "above."
      )
    );
    nodes.push(
      table(
        "Token volumes (copilot) — no dollars",
        [
          { label: "Model", name: true },
          { label: "Messages", figure: true },
          { label: "Output tokens", figure: true },
        ],
        cost.copilot.rows.map((row) => [
          row.model === null ? "(no model recorded)" : row.model,
          row.messages,
          row.output_rendered,
        ])
      )
    );
  }

  for (const entry of cost.sessions.no_signal) {
    nodes.push(
      el(
        "p",
        "note",
        entry.sessions +
          " " +
          entry.source_agent +
          " sessions recorded no per-message usage at all, so nothing about their cost can be read" +
          " at any price."
      )
    );
  }

  const flagged = cost.flagged;
  if (flagged.any) {
    nodes.push(el("p", "note", "Unpriced and flagged — tokens the archive recorded that this build did not turn into dollars. None of it is estimated, interpolated, or rounded into the total above."));
    const list = el("ul", "flags");
    if (flagged.synthetic) {
      list.appendChild(
        el(
          "li",
          null,
          "Unbilled (synthetic) — " +
            flagged.synthetic.messages +
            " messages, " +
            flagged.synthetic.tokens.total.rendered +
            " tokens. Claude Code's placeholder for messages it generated locally; no vendor" +
            " billed them."
        )
      );
    }
    for (const unpriced of flagged.unpriced) {
      list.appendChild(
        el(
          "li",
          null,
          "Unpriced — " +
            unpriced.messages +
            " messages, " +
            unpriced.tokens.total.rendered +
            " tokens: " +
            unpriced.detail +
            "."
        )
      );
    }
    if (flagged.untiered_cache_writes) {
      list.appendChild(
        el(
          "li",
          null,
          "Cache writes with no tier — " +
            flagged.untiered_cache_writes.rendered +
            " tokens across " +
            flagged.untiered_cache_writes.messages +
            " messages stated only as a total. The two tiers bill at different multiples of" +
            " input, so such a write has no rate and is left out rather than charged at an" +
            " assumed one."
        )
      );
    }
    if (flagged.undeduplicatable) {
      list.appendChild(
        el(
          "li",
          null,
          "Undeduplicatable usage — " +
            flagged.undeduplicatable.records +
            " records carrying " +
            flagged.undeduplicatable.rendered +
            " tokens were summed per record, so this share of the total may be counted more than" +
            " once. Over-counting rather than dropping real spend, and named either way."
        )
      );
    }
    nodes.push(list);
  }

  if (cost.duplicate_records) {
    nodes.push(
      el(
        "p",
        "note",
        "Deduplication dropped " +
          cost.duplicate_records +
          " further records that repeated a message already counted: one API message reaches a" +
          " transcript as several records repeating its usage verbatim, so summing records would" +
          " have inflated every figure above."
      )
    );
  }
  for (const gap of cost.gaps) {
    nodes.push(el("p", "note", "Gap — " + gap.count + " — " + gap.reason));
  }
  return nodes;
}

/* The standup. Every string here came out of the fold already scrubbed, and the
   redaction markers are rendered exactly as they arrived: a reader has to be able to
   see that the scrub fired, so a marker is shown rather than tidied away. */
function standupSession(session) {
  const card = el("div", "session-card");
  card.appendChild(el("h4", null, session.title));
  const meta = [
    "archived " + (session.archived_at || "at an unreadable time") + " (UTC)",
    session.branch ? "branch " + session.branch : null,
    "sha256:" + session.source_hash,
  ]
    .filter(Boolean)
    .join(" · ");
  card.appendChild(el("div", "session-meta", meta));
  card.appendChild(el("p", "session-goal", session.goal));
  const work = el("ul", "work");
  if (session.work_completed.length) {
    for (const item of session.work_completed) work.appendChild(el("li", null, item));
  } else {
    work.appendChild(el("li", null, "(this session's summary lists no completed work)"));
  }
  card.appendChild(work);
  return card;
}

function rollup(heading, lines, note) {
  const nodes = [el("p", "headline-sub", heading)];
  if (!lines.length) {
    nodes.push(el("p", "empty", "No session in this window recorded any under this heading."));
    return nodes;
  }
  const list = el("ul", "rollup");
  for (const line of lines) {
    const item = el("li", null, line.text + " ");
    item.appendChild(el("span", "where", line.repository));
    list.appendChild(item);
  }
  nodes.push(list);
  nodes.push(el("p", "note", note));
  return nodes;
}

function standupSection(standup) {
  const nodes = [];
  if (standup.sessions === 0) {
    nodes.push(
      el(
        "p",
        "empty",
        "No archived session in the last " +
          standup.window.last +
          " carried a summary to narrate. Anything the archive did hold is below."
      )
    );
  } else {
    nodes.push(
      el(
        "p",
        "headline-sub",
        standup.sessions +
          " sessions across " +
          standup.repositories_narrated +
          (standup.repositories_narrated === 1 ? " repository" : " repositories") +
          ", archived since " +
          standup.window.opens_at +
          " (UTC) — narrated from the summaries munshi wrote when it captured them. No model" +
          " reconstructed any of this."
      )
    );
    for (const group of standup.repositories) {
      const repo = el("div", "repo");
      repo.appendChild(el("h3", null, group.repository));
      for (const session of group.sessions) repo.appendChild(standupSession(session));
      nodes.push(repo);
    }
  }

  nodes.push(
    ...rollup(
      "Decisions",
      standup.decisions,
      "These are the decisions the sessions themselves recorded, in reading order, with exact" +
        " repeats within a repository dropped."
    )
  );
  nodes.push(
    ...rollup(
      "Open items",
      standup.open_items,
      "These are the open items the sessions themselves recorded — what was still owed when each" +
        " capture ended, not a live task list."
    )
  );

  if (standup.gaps.length) {
    nodes.push(el("p", "headline-sub", "Gaps"));
    const list = el("ul", "flags");
    for (const gap of standup.gaps) {
      list.appendChild(el("li", null, gap.count + " — " + gap.reason));
    }
    nodes.push(list);
  }
  return nodes;
}

/* What the scrub did to the prose above, in the document that carries it. A reader
   looking at an unmarked standup needs to know whether that means "nothing matched"
   or "the scrub was off", and those are very different sentences. */
function standupScrubNote(standup, redaction) {
  if (!redaction.secrets) {
    return (
      "The prose above is SERVED RAW: this dashboard was started with --no-redact, so nothing in" +
      " it was scrubbed for secrets."
    );
  }
  const fired = standup.redaction.total
    ? standup.redaction.total +
      " replacements were made (" +
      standup.redaction.fired.map((entry) => entry.pattern + " ×" + entry.count).join(", ") +
      ")"
    : "Nothing matched";
  return (
    "Every line of prose above came out of the archive and was scrubbed for secrets before it was" +
    " rendered, against pattern set " +
    redaction.pattern_revision +
    ". " +
    fired +
    ". What a pattern matched is never recorded, printed, or counted per value — only that it" +
    " fired."
  );
}

function render(data) {
  const provenance = data.provenance;
  const harnesses = Object.entries(data.sessions.by_harness)
    .map(([name, count]) => name + " (" + count + ")")
    .join(", ");
  document.getElementById("subtitle").textContent =
    "Scored over the last " +
    data.window.last +
    " — " +
    data.sessions.folded +
    " sessions since " +
    data.window.opens_at +
    " (UTC)" +
    (harnesses ? " — " + harnesses : "") +
    ". Cost covers the last " +
    data.cost.window.last +
    " and the standup the last " +
    data.standup.window.last +
    "; each section says which.";

  if (provenance.stale_since) {
    banner(
      "These numbers are from " +
        provenance.refreshed_at +
        "; every refresh since " +
        provenance.stale_since +
        " has failed. Nothing below has been recomputed."
    );
  } else {
    banner("");
  }

  document.getElementById("tiles").replaceChildren(...data.lanes.map(laneTile));

  const findings = document.getElementById("findings");
  if (data.findings.length === 0) {
    findings.replaceChildren(
      el(
        "p",
        "empty",
        "Nothing crossed a rule threshold this window. The thresholds are first guesses, so a " +
          "quiet window is as much a statement about them as about the work."
      )
    );
  } else {
    findings.replaceChildren(
      ...data.findings.map((finding) => findingCard(finding, data.sessions.folded))
    );
  }

  document.getElementById("cost").replaceChildren(...costSection(data.cost));
  document
    .getElementById("standup")
    .replaceChildren(
      ...standupSection(data.standup),
      el("p", "note", standupScrubNote(data.standup, provenance.redaction))
    );

  const footer = document.getElementById("provenance");
  const gaps = provenance.gaps
    .map((gap) => gap.count + " — " + gap.reason)
    .join("; ");
  const lines = [
    "Scores are a function of the rule pack stamped below and of nothing else, so two windows " +
      "compare only when that stamp matches. 100 means nothing this pack penalizes was observed, " +
      "not that the practice is perfect. Scores move across windows; they do not compare across " +
      "lanes. Fleet is the unweighted mean of the per-harness scores, and carries an arrow only " +
      "when the same harnesses scored the lane in both windows.",
    "The scores and the cost above are aggregates, rule ids, counts and transcript content " +
      "hashes; a finding will expand into the individual events that rule counted, one event " +
      "each. The standup is the archive's own prose, " +
      (provenance.redaction.secrets
        ? "scrubbed for secrets by pattern set " + provenance.redaction.pattern_revision
        : "SERVED RAW: this dashboard was started with --no-redact") +
      ". Nothing else from a transcript is served, and there is no link into the archive. To " +
      "read a whole session, take its hash to your own shell.",
    "Coaching " +
      provenance.window +
      " · " +
      provenance.sessions_folded +
      " sessions (+" +
      provenance.comparison_sessions_folded +
      " comparison) of " +
      provenance.sessions_listed +
      " listed · sync " +
      provenance.sync +
      " · fold " +
      provenance.fold +
      " · " +
      provenance.bytes_folded +
      " folded · cache " +
      provenance.cache_hits +
      " hits / " +
      provenance.cache_misses +
      " misses (" +
      provenance.bytes_transferred +
      " transferred)",
    "Cost " +
      provenance.lanes.cost.window +
      " · " +
      provenance.lanes.cost.sessions_folded +
      " sessions (+" +
      provenance.lanes.cost.comparison_sessions_folded +
      " comparison) · " +
      provenance.lanes.cost.records_read +
      " records · sync " +
      provenance.lanes.cost.sync +
      " · fold " +
      provenance.lanes.cost.fold,
    "Standup " +
      provenance.lanes.standup.window +
      " · " +
      provenance.lanes.standup.sessions_folded +
      " sessions · " +
      provenance.lanes.standup.bytes_folded +
      " read · sync " +
      provenance.lanes.standup.sync +
      " · fold " +
      provenance.lanes.standup.fold,
    "Rule pack " +
      provenance.rule_pack +
      " · price table " +
      provenance.price_table_revision +
      " · redaction patterns " +
      provenance.redaction_pattern_revision +
      " · refresh " +
      provenance.generation +
      " at " +
      provenance.refreshed_at +
      " in " +
      provenance.refresh_elapsed +
      ", every " +
      provenance.refresh_interval,
  ];
  if (gaps) lines.push("Gaps — " + gaps);
  const nodes = lines.map((line) => el("p", null, line));
  nodes.push(el("p", "archive", "Archive " + provenance.patwari_url + " · cache " + provenance.cache_root));
  footer.replaceChildren(...nodes);
}

async function load() {
  const response = await fetch("/api/data", { cache: "no-store" });
  if (!response.ok) throw new Error("the payload came back " + response.status);
  const data = await response.json();
  generation = data.provenance.generation;
  render(data);
}

async function reload() {
  try {
    await load();
  } catch (error) {
    banner("Could not reach the qanungo dashboard: " + error.message);
  }
}

function subscribe() {
  const events = new EventSource("/api/events");
  events.addEventListener("refresh", (event) => {
    let notice;
    try {
      notice = JSON.parse(event.data);
    } catch (error) {
      return;
    }
    // The stream sends the current generation on connect too, so a reconnecting
    // page takes the same path as a refreshing one and re-fetches only when the
    // fold behind the payload actually moved.
    if (notice.generation !== generation) reload();
  });
  events.addEventListener("error", () => {
    banner("Lost the refresh stream; reconnecting.");
  });
  // Nothing is re-fetched here: the stream's first event carries the server's
  // current generation, so a server that restarted announces itself and a
  // connection that merely dropped costs one comparison.
  events.addEventListener("open", () => banner(""));
}

reload().then(subscribe);
</script>
</body>
</html>
