 * A 7×24 grid — weekday down, local hour across — of when in the operator's own
 * day the work began. Every number was computed in Rust and arrives as an integer
 * on a (weekday, hour) cell that Rust already shifted into the capturing machine's
 * local time. This file colours a cell by magnitude and labels the two axes; it
 * counts nothing and sums only across the harnesses of one cell, which the payload
 * already split. It builds no date through `Date`: the weekday and the hour are
 * indices into the two static label lists below, and re-expressing a local hour
 * through the reader's own zone is the exact confusion this whole view avoids.
 *
 * Unlike the timeline it does not stack the harnesses — it sums them to one
 * intensity, because a heatmap's colour is a quantity, not an identity. The split
 * is in the tooltip and the table.
 * ------------------------------------------------------------------------ */

const HEATMAP = {
  padLeft: 34,
  padTop: 18,
  padRight: 8,
  padBottom: 6,
  cellWidth: 22,
  cellHeight: 20,
  gap: 2,
  /* The faintest a non-empty cell is drawn. A single session in a quiet hour must
     still read as ink and not as an empty slot, so the intensity scale starts
     here rather than at zero opacity. */
  minInk: 0.16,
};

/* Monday-first, because num_days_from_monday is the index Rust sends: 0 is Monday
   and 6 is Sunday. */
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* The heatmap's own measure, held apart from the timeline's so a reader can keep
   sessions on one view and hours on the other. */
let heatMeasure = "sessions";

/* One entry per (weekday, hour) cell the payload carries, each summed over the
   selected series — every harness, or exactly the one a scope picked, on the same
   selection rule the timeline uses. */
function heatmapCells(heatmap, series) {
  return heatmap.cells.map((cell) => {
    const parts = series.map((entry) => ({
      series: entry,
      sessions: cell.sessions[entry.index] || 0,
      seconds: cell.active_seconds[entry.index] || 0,
    }));
    return {
      weekday: cell.weekday,
      hour: cell.hour,
      parts,
      sessions: parts.reduce((total, part) => total + part.sessions, 0),
      seconds: parts.reduce((total, part) => total + part.seconds, 0),
    };
  });
}

function heatValue(cell) {
  return heatMeasure === "sessions" ? cell.sessions : cell.seconds / 3600;
}

/* Two-digit hour, and the hour after it, as a local range: `09:00–10:00`. Built
   from the integer hour and never from a date, so it means the same thing in every
   reader's zone. Hour 23 wraps to `00:00`. */
function hourRange(hour) {
  const pad = (value) => String(value).padStart(2, "0");
  return pad(hour) + ":00–" + pad((hour + 1) % 24) + ":00";
}

/* What one cell says when a reader points at it: the local weekday and hour range,
   both measures, and the harnesses inside it. Set as an SVG <title>, which is the
   group's accessible name and its tooltip at once. */
function heatCellTitle(weekday, hour, cell) {
  const parts = [WEEKDAYS[weekday] + " " + hourRange(hour)];
  if (!cell || cell.sessions === 0) {
    parts.push("no session began here");
    return parts.join(" · ");
  }
  parts.push(cell.sessions + (cell.sessions === 1 ? " session" : " sessions"));
  parts.push(activeHours(cell.seconds) + "h active");
  for (const part of cell.parts) {
    if (!part.sessions) continue;
    parts.push(part.series.label + " " + part.sessions + " · " + activeHours(part.seconds) + "h");
  }
  return parts.join(" · ");
}

/* The grid itself, into the <svg> the document already carries. */
function drawHeatmap(cells) {
  const chart = document.getElementById("heatmap-chart");
  const ns = chart.namespaceURI;
  const shape = (tag, className) => {
    const node = document.createElementNS(ns, tag);
    if (className) node.setAttribute("class", className);
    return node;
  };
  const set = (node, attributes) => {
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, String(value));
    return node;
  };

  const width = HEATMAP.padLeft + 24 * HEATMAP.cellWidth + HEATMAP.padRight;
  const height = HEATMAP.padTop + 7 * HEATMAP.cellHeight + HEATMAP.padBottom;
  set(chart, { width, height, viewBox: "0 0 " + width + " " + height });

  const title = document.getElementById("heatmap-title");
  const desc = document.getElementById("heatmap-desc");
  title.textContent =
    heatMeasure === "sessions"
      ? "Sessions by the local hour of the week their work began"
      : "Active hours by the local hour of the week each session began (attributed to that hour)";
  desc.textContent = cells.length
    ? "A seven-by-twenty-four grid, weekday down and local hour across, coloured by how much work" +
      " began in each hour of the operator's own day. The same numbers are in the table below."
    : "No session in this window could be placed on a local clock.";

  const byKey = new Map();
  for (const cell of cells) byKey.set(cell.weekday * 24 + cell.hour, cell);
  const max = Math.max(1, ...cells.map(heatValue));

  const nodes = [];
  /* Weekday labels down the left, one per row. */
  for (let day = 0; day < 7; day += 1) {
    const label = shape("text", "axis-text");
    const y = HEATMAP.padTop + day * HEATMAP.cellHeight + HEATMAP.cellHeight / 2 + 3;
    set(label, { x: HEATMAP.padLeft - 6, y, "text-anchor": "end" });
    label.textContent = WEEKDAYS[day];
    nodes.push(label);
  }
  /* Hour labels across the top, every three hours — enough to read the axis
     without a number over each of twenty-four columns. */
  for (let hour = 0; hour <= 21; hour += 3) {
    const label = shape("text", "axis-text");
    const x = HEATMAP.padLeft + hour * HEATMAP.cellWidth + HEATMAP.cellWidth / 2;
    set(label, { x, y: HEATMAP.padTop - 6, "text-anchor": "middle" });
    label.textContent = String(hour);
    nodes.push(label);
  }
  /* Every slot in the grid gets a rect — the empty ones too, so the shape reads as
     a grid. A non-empty cell's opacity is the intensity floor plus its share of
     the busiest cell, so the darkest cell is full and the quietest still shows. */
  for (let day = 0; day < 7; day += 1) {
    for (let hour = 0; hour < 24; hour += 1) {
      const cell = byKey.get(day * 24 + hour);
      // Presence is "a session began here", not the current measure's magnitude: on the
      // active-hours measure a covered cell can read zero, and it must still show as a cell
      // that work began in rather than as an empty slot. Its intensity still tracks the
      // measure (the floor for a zero), so the reader never loses the started session.
      const present = Boolean(cell) && cell.sessions > 0;
      const value = cell ? heatValue(cell) : 0;
      const x = HEATMAP.padLeft + hour * HEATMAP.cellWidth;
      const y = HEATMAP.padTop + day * HEATMAP.cellHeight;
      const group = shape("g");
      const label = shape("title");
      label.textContent = heatCellTitle(day, hour, cell);
      group.appendChild(label);
      const rect = set(shape("rect", present ? "cell" : "cell empty"), {
        x: x + HEATMAP.gap / 2,
        y: y + HEATMAP.gap / 2,
        width: HEATMAP.cellWidth - HEATMAP.gap,
        height: HEATMAP.cellHeight - HEATMAP.gap,
        rx: 3,
      });
      if (present) {
        rect.setAttribute(
          "fill-opacity",
          (HEATMAP.minInk + (1 - HEATMAP.minInk) * (value / max)).toFixed(3)
        );
      }
      group.appendChild(rect);
      nodes.push(group);
    }
  }
  chart.replaceChildren(title, desc, ...nodes);
}

/* The intensity legend: a low-to-high strip of the one hue, so a reader learns the
   colour is a quantity. Absent when the grid is empty, where there is no scale to
   describe. */
function drawHeatmapLegend(cells) {
  const legend = document.getElementById("heatmap-legend");
  if (!cells.length) {
    legend.replaceChildren();
    return;
  }
  const max = Math.max(1, ...cells.map(heatValue));
  const scale = el("div", "heat-scale");
  scale.appendChild(el("span", null, "less"));
  for (const step of [0, 0.25, 0.5, 0.75, 1]) {
    const swatch = el("span", "heat-swatch");
    swatch.style.opacity = (HEATMAP.minInk + (1 - HEATMAP.minInk) * step).toFixed(3);
    scale.appendChild(swatch);
  }
  const top = heatMeasure === "sessions" ? max + (max === 1 ? " session" : " sessions") : activeHours(max * 3600) + "h";
  scale.appendChild(el("span", null, "more (to " + top + ")"));
  legend.replaceChildren(scale);
}

/* The same numbers as a table, behind a disclosure — the non-empty cells only,
   because a full 168-row table would bury the handful that carry anything. It is
   what makes the grid legible to a reader whose screen or colour vision cannot
   separate two opacities. */
function heatmapTable(cells, series) {
  const heading = [
    { label: "Weekday" },
    { label: "Local hour" },
    ...series.map((entry) => ({ label: entry.label, figure: true })),
    { label: "Total", figure: true },
  ];
  const cell = (value) => (heatMeasure === "sessions" ? String(value) : value.toFixed(1) + "h");
  const value = (part) => (heatMeasure === "sessions" ? part.sessions : part.seconds / 3600);
  const rows = cells
    .filter((entry) => entry.sessions > 0)
    .map((entry) => [
      WEEKDAYS[entry.weekday],
      hourRange(entry.hour),
      ...entry.parts.map((part) => cell(value(part))),
      cell(heatValue(entry)),
    ]);
  const details = el("details");
  details.appendChild(el("summary", null, "The numbers behind the grid"));
  details.appendChild(table(null, heading, rows));
  return details;
}

function heatmapNote(heatmap, cells) {
  const covered =
    "Work began in " +
    heatmap.cells_covered +
    (heatmap.cells_covered === 1 ? " local hour-of-week slot" : " local hour-of-week slots") +
    " this window. ";
  const basis =
    "A cell is the local hour of the weekday each session's work began — the transcript's own" +
    " first-activity time shifted by the capturing machine's UTC offset, not archive time and not" +
    " the reader's zone. This is the view a wrong clock misplaces: 'at 1 a.m.' and 'on a Sunday'" +
    " are exactly the claims a missing offset gets wrong. The active-hours measure attributes a" +
    " session's whole active time to the hour it began, because the fold keeps no finer per-hour" +
    " breakdown to spread it across.";
  const noOffset = heatmap.no_offset
    ? " " +
      heatmap.no_offset +
      (heatmap.no_offset === 1 ? " session carries" : " sessions carry") +
      " no recorded offset and " +
      (heatmap.no_offset === 1 ? "is" : "are") +
      " on no cell, counted not guessed."
    : "";
  const undated = heatmap.undated
    ? " " +
      heatmap.undated +
      (heatmap.undated === 1 ? " session has" : " sessions have") +
      " an offset but no readable activity time and " +
      (heatmap.undated === 1 ? "is" : "are") +
      " on no cell."
    : "";
  const empty = cells.length ? "" : " Nothing to draw in this scope.";
  return covered + basis + noOffset + undated + empty;
}

function paintHeatmap(data, entry, column) {
  const heatmap = scopeIsRepository(entry) ? entry.heatmap : data.heatmap;
  const series = timelineSeries(data, column);
  const cells = heatmapCells(heatmap, series);
  drawHeatmapLegend(cells);
  drawHeatmap(cells);
  document.getElementById("heatmap-note").textContent = heatmapNote(heatmap, cells);
  document
    .getElementById("heatmap-table")
    .replaceChildren(...(cells.some((cell) => cell.sessions > 0) ? [heatmapTable(cells, series)] : []));
}

/* ------------------------------------------------------------------------
 * Pipeline health: is the fleet still reporting, and is anything stuck?
 *
 * Five views over one payload key. Every one of them is a field read: the device
 * rows are the same grouping the device control is built from, the calendar is the
 * same UTC archive day the timeline places a session on, the gap counts came off the
 * mirror's own run, the archive totals are the archive's own integers, and the mirror
 * block is what this disk is holding. Nothing here counts, sums, averages or rates.
 *
 * The scope interaction is deliberately partial, and the note says so on the page:
 * a harness selection narrows the device table's own numbers (they are already split
 * per harness in the payload), a device selection highlights its row, and a repository
 * selection leaves the whole panel alone — a repository is not a machine, and cutting
 * a fleet view by one would be answering a question nobody asked.
 * ------------------------------------------------------------------------ */

const FLEET = {
  padLeft: 34,
  padRight: 8,
  padTop: 10,
  padBottom: 26,
  plotHeight: 90,
  slot: 14,
  widestSlot: 36,
  slotAir: 3,
  widestBar: 20,
  leastPlot: 280,
  gap: 2,
  radius: 3,
};

/* The device axis the landing chart stacks by: one series per device in the payload's
   own order, coloured by its place in that order and never by its rank among whatever
   is drawn — the same rule the timeline's harness colours follow, so a device keeps
   its colour when a quiet one drops out of the window. */
function fleetSeries(fleet) {
  return fleet.devices.map((device, index) => ({
    label: device.device,
    index,
    klass: index < 3 ? "s" + index : "sx",
  }));
}

/* How many sessions this device holds in the reader's current harness scope. With no
   harness chosen it is the row's own total; with one chosen it is that harness's entry
   in the split the payload already carries. A device that ran nothing with the chosen
   harness is 0, which is a reading. */
function fleetDeviceSessions(device, data, column) {
  if (column < 0) return device.sessions;
  return device.by_harness[data.scopes.harnesses[column]] || 0;
}

function fleetHarnessMix(device, data, column) {
  if (column < 0) return device.harness_mix;
  const harness = data.scopes.harnesses[column];
  return harness + " " + (device.by_harness[harness] || 0);
}

/* When this device was last heard from, and whether that was long enough ago for the
   payload to have flagged it. The threshold and the flag are both the server's — this
   writes the word beside the time it already sent. */
function fleetLastCapture(device) {
  if (!device.last_capture_at) return "no dated capture";
  if (!device.silent) return device.last_capture_at;
  return device.last_capture_at + " — silent " + device.silent_days + "d";
}

/* The devices table. Built here rather than through `table` because one row may be the
   scoped one and one cell may be flagged, and both are classes on elements this has to
   make itself. */
function fleetDevicesTable(data, entry, column) {
  const fleet = data.fleet;
  const scoped = entry && !scopeIsRepository(entry) ? entry.device : null;
  const block = document.createDocumentFragment();
  block.appendChild(el("h3", null, "Devices"));
  if (fleet.devices.length === 0) {
    block.appendChild(el("p", "empty", "No session in this window carries a device."));
    return block;
  }
  const scroller = el("div", "scroller");
  const node = el("table");
  const head = el("tr");
  for (const heading of [
    { label: "Device" },
    { label: "Sessions", figure: true },
    { label: "Harness mix" },
    { label: "Last capture" },
  ]) {
    head.appendChild(el("th", heading.figure ? "figure" : null, heading.label));
  }
  const thead = el("thead");
  thead.appendChild(head);
  node.appendChild(thead);
  const body = el("tbody");
  for (const device of fleet.devices) {
    const row = el("tr", device.device === scoped ? "scoped" : null);
    row.appendChild(el("td", "name", device.device));
    row.appendChild(el("td", "figure", String(fleetDeviceSessions(device, data, column))));
    row.appendChild(el("td", null, fleetHarnessMix(device, data, column)));
    row.appendChild(el("td", device.silent ? "silent" : null, fleetLastCapture(device)));
    body.appendChild(row);
  }
  node.appendChild(body);
  scroller.appendChild(node);
  block.appendChild(scroller);
  block.appendChild(
    el(
      "p",
      "note",
      "A device is the host the capture ran on, as the snapshot manifest recorded it — the same " +
        "labels the Device control above offers. Last capture is archive time. A device is " +
        "called silent after " +
        fleet.silent_after_days +
        " days without one; the exact time is beside the word, because it is a flag and not a " +
        "verdict. Only devices with a session in this window are here — a machine that stopped " +
        "reporting altogether shows up in the archive's client list below, which is the one place " +
        "that knows about it."
    )
  );
  return block;
}

/* The landing chart's own columns: one per day the payload placed sessions on, each
   split by device. */
function fleetColumns(fleet) {
  const series = fleetSeries(fleet);
  return fleet.landing.days.map((day) => ({
    date: day.date,
    sessions: day.sessions,
    parts: series.map((entry) => ({ series: entry, value: day.by_device[entry.index] || 0 })),
  }));
}

function fleetSlot(count) {
  const wanted = Math.ceil(FLEET.leastPlot / Math.max(count, 1));
  return Math.min(Math.max(FLEET.slot, wanted), FLEET.widestSlot);
}

/* What one column says when a reader points at it. The date, the total, and the split
   — all four numbers already in the payload. */
function fleetColumnTitle(column) {
  const split = column.parts
    .filter((part) => part.value > 0)
    .map((part) => part.series.label + " " + part.value)
    .join(" · ");
  return (
    dayLabel(column.date) +
    " — " +
    column.sessions +
    (column.sessions === 1 ? " session" : " sessions") +
    (split ? " (" + split + ")" : "")
  );
}

/* The sparkline: a small stacked column per day, in the page's own chart marks and
   drawn into the <svg> the document already carries — so the SVG namespace is read
   off a real node and this file still loads nothing from anywhere. */
function drawFleetLanding(columns) {
  const chart = document.getElementById("fleet-landing-chart");
  const ns = chart.namespaceURI;
  const shape = (tag, className) => {
    const node = document.createElementNS(ns, tag);
    if (className) node.setAttribute("class", className);
    return node;
  };
  const set = (node, attributes) => {
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, String(value));
    return node;
  };

  const slot = fleetSlot(columns.length);
  const bar = Math.min(slot - FLEET.slotAir * 2, FLEET.widestBar);
  const width = FLEET.padLeft + columns.length * slot + FLEET.padRight;
  const height = FLEET.padTop + FLEET.plotHeight + FLEET.padBottom;
  const base = FLEET.padTop + FLEET.plotHeight;
  set(chart, { width, height, viewBox: "0 0 " + width + " " + height });

  const title = document.getElementById("fleet-landing-title");
  const desc = document.getElementById("fleet-landing-desc");
  title.textContent = "Sessions landing per day, by device";
  desc.textContent = columns.length
    ? "A stacked column per day over " +
      columns.length +
      " days, split by the device the capture ran on, on the UTC day the archive finished each" +
      " session's snapshot. The same numbers are in the table below."
    : "Nothing landed on any day in this window.";
  if (!columns.length) {
    chart.replaceChildren(title, desc);
    return;
  }

  const nodes = [];
  const max = niceMax(Math.max(...columns.map((column) => column.sessions)));
  for (const tick of [0, max]) {
    const y = base - (tick / max) * FLEET.plotHeight;
    nodes.push(
      set(shape("line", "grid"), { x1: FLEET.padLeft, y1: y, x2: width - FLEET.padRight, y2: y })
    );
    const label = shape("text", "axis-text");
    set(label, { x: FLEET.padLeft - 6, y: y + 3, "text-anchor": "end" });
    label.textContent = String(tick);
    nodes.push(label);
  }

  columns.forEach((column, index) => {
    const slotX = FLEET.padLeft + index * slot;
    const group = shape("g");
    const label = shape("title");
    label.textContent = fleetColumnTitle(column);
    group.appendChild(label);
    group.appendChild(
      set(shape("rect", "hit"), {
        x: slotX,
        y: FLEET.padTop,
        width: slot,
        height: FLEET.plotHeight,
      })
    );
    const drawn = column.parts.filter((part) => part.value > 0);
    let cursor = base;
    drawn.forEach((part, at) => {
      const span = (part.value / max) * FLEET.plotHeight;
      const top = at === drawn.length - 1;
      const tall = Math.max(span - (top ? 0 : FLEET.gap), 1);
      const y = cursor - tall;
      const x = slotX + (slot - bar) / 2;
      if (top) {
        group.appendChild(
          set(shape("path", part.series.klass), { d: barPath(x, y, bar, tall, FLEET.radius) })
        );
      } else {
        group.appendChild(set(shape("rect", part.series.klass), { x, y, width: bar, height: tall }));
      }
      cursor -= span;
    });
    nodes.push(group);
  });

  nodes.push(
    set(shape("line", "grid"), {
      x1: FLEET.padLeft,
      y1: base,
      x2: width - FLEET.padRight,
      y2: base,
    })
  );

  const last = columns.length - 1;
  for (const index of [...new Set([0, last])]) {
    const text = shape("text", "axis-text");
    const anchor = index === 0 ? "start" : "end";
    const at = FLEET.padLeft + index * slot + (anchor === "start" ? 0 : slot);
    set(text, { x: at, y: base + 14, "text-anchor": anchor });
    text.textContent = dayLabel(columns[index].date);
    nodes.push(text);
  }

  chart.replaceChildren(title, desc, ...nodes);
}

/* The device legend, on the same rule the timeline's is: present whenever more than one
   series is drawn, because identity must never rest on colour alone. */
function drawFleetLegend(series) {
  const legend = document.getElementById("fleet-landing-legend");
  if (series.length < 2) {
    legend.replaceChildren();
    return;
  }
  legend.replaceChildren(
    ...series.map((entry) => {
      const item = el("div", "legend-item");
      item.appendChild(el("span", "legend-swatch " + entry.klass));
      item.appendChild(el("span", null, entry.label));
      return item;
    })
  );
}

function fleetLandingTable(columns, series) {
  const heading = [
    { label: "Day" },
    ...series.map((entry) => ({ label: entry.label, figure: true })),
    { label: "Sessions", figure: true },
  ];
  const rows = columns.map((column) => [
    column.date,
    ...column.parts.map((part) => String(part.value)),
    String(column.sessions),
  ]);
  const details = el("details");
  details.appendChild(el("summary", null, "The numbers behind the chart"));
  details.appendChild(table(null, heading, rows));
  return details;
}

function fleetLandingNote(fleet) {
  const landing = fleet.landing;
  const undated =
    landing.undated > 0
      ? " " +
        landing.undated +
        " session" +
        (landing.undated === 1 ? " carries" : "s carry") +
        " an archive time this build could not read, so " +
        (landing.undated === 1 ? "it is" : "they are") +
        " on no day and counted here instead."
      : "";
  return (
    landing.sessions +
    " sessions on " +
    landing.days_covered +
    " days. A day is the UTC calendar day the archive finished the session's snapshot — the same" +
    " clock the timeline above uses and the one the window itself is cut on, never the machine's" +
    " own local time. Every session in the window is read from exactly one snapshot, so a" +
    " snapshot count per day would be this same series under another name; the archive's own" +
    " snapshot total is in the totals below." +
    undated
  );
}

/* What did not arrive whole. Three numbers off the mirror's own run, and then the
   report's Gaps lines verbatim — the same list the footer carries, repeated here
   because this is where a reader comes to find out what is stuck. */
function fleetGaps(fleet) {
  const gaps = fleet.gaps;
  const block = document.createDocumentFragment();
  block.appendChild(el("h3", null, "Gaps"));
  block.appendChild(
    el(
      "p",
      "note",
      gaps.projection_unusable +
        " session" +
        (gaps.projection_unusable === 1 ? "'s" : "s'") +
        " newest snapshot carried no readable transcript — " +
        gaps.recovered_from_sibling +
        " recovered from an older sibling snapshot, " +
        gaps.unrecovered +
        " not. The mirror walks a session's other snapshots whenever the archive's projection" +
        " cannot answer, so a recovery costs a request and loses nothing. " +
        gaps.sessions_folded +
        " of " +
        gaps.sessions_listed +
        " listed sessions were folded."
    )
  );
  if (gaps.notes.length) {
    const list = el("ul", "flags");
    for (const note of gaps.notes) {
      list.appendChild(el("li", null, note.count + " — " + note.reason));
    }
    block.appendChild(list);
  }
  return block;
}

/* The archive's own totals, or the sentence saying why there are none. The server
   decides which of those two it is and writes the sentence; this switches on a
   boolean. */
function fleetArchive(fleet) {
  const archive = fleet.archive;
  const block = document.createDocumentFragment();
  block.appendChild(el("h3", null, "Archive totals"));
  if (!archive.available) {
    block.appendChild(el("p", "note", archive.reason));
    return block;
  }
  block.appendChild(
    table(
      null,
      [{ label: "What" }, { label: "How much", figure: true }],
      [
        ["Sessions", String(archive.sessions)],
        ["Snapshots", String(archive.snapshots)],
        ["Captures", String(archive.captures)],
        ["Artifacts", String(archive.artifacts)],
        ["Blobs", String(archive.blobs)],
        ["Stored", archive.stored],
        ["Original", archive.original],
        ["Tombstones", String(archive.tombstones)],
      ]
    )
  );
  block.appendChild(
    table(
      "Clients",
      [
        { label: "Device" },
        { label: "Captures", figure: true },
        { label: "First seen" },
        { label: "Last seen" },
      ],
      archive.clients.map((client) => [
        client.device,
        String(client.captures),
        client.first_seen_at,
        client.last_seen_at || "never",
      ])
    )
  );
  block.appendChild(
    el(
      "p",
      "note",
      "Straight from the archive, counted by the archive: last ingest " +
        (archive.last_ingest_at || "never") +
        ", activity from " +
        (archive.oldest_activity_at || "none") +
        " to " +
        (archive.newest_activity_at || "none") +
        ", taken at " +
        archive.generated_at +
        ". These are totals over everything the archive holds, not over this page's window, and" +
        " they are the only figures here no scope narrows."
    )
  );
  return block;
}

/* This mirror: what it is holding, and what the last coaching sync cost. Every figure
   is also in the footer — repeated because the footer answers what the page cost to
   build and this answers whether the copy on this disk is healthy. */
function fleetMirror(fleet) {
  const mirror = fleet.mirror;
  const block = document.createDocumentFragment();
  block.appendChild(el("h3", null, "This mirror"));
  block.appendChild(
    el(
      "p",
      "note",
      mirror.size +
        " over " +
        mirror.files +
        " files at " +
        mirror.cache_root +
        ". Last coaching sync " +
        mirror.sync +
        " · fold " +
        mirror.fold +
        " · " +
        mirror.sessions_folded +
        " of " +
        mirror.sessions_listed +
        " listed sessions folded · cache " +
        mirror.cache_hits +
        " hits / " +
        mirror.cache_misses +
        " misses · snapshots " +
        mirror.snapshots_indexed +
        " indexed / " +
        mirror.snapshots_fetched +
        " fetched."
    )
  );
  return block;
}

function fleetNote(entry) {
  const base =
    "Aggregates only: counts, times, device labels, harness names and byte sizes. No transcript" +
    " or summary text reaches this section. Every figure was folded server-side with the rest of" +
    " this payload — the panel makes no request of its own and none of it touches the archive.";
  if (!entry) return base;
  return (
    base +
    (scopeIsRepository(entry)
      ? " A repository scope leaves this panel whole: a repository is not a machine, so nothing" +
        " here is cut by one."
      : " The device you scoped to is the highlighted row; the rest of the panel stays whole," +
        " because the archive's totals and this mirror's own state are facts about the pipeline" +
        " rather than about one machine.")
  );
}

function paintFleet(data, entry, column) {
  const fleet = data.fleet;
  document.getElementById("fleet-note").textContent = fleetNote(entry);
  document.getElementById("fleet-devices").replaceChildren(fleetDevicesTable(data, entry, column));

  const series = fleetSeries(fleet);
  const columns = fleetColumns(fleet);
  drawFleetLegend(series);
  drawFleetLanding(columns);
  document.getElementById("fleet-landing-note").textContent = fleetLandingNote(fleet);
  document
    .getElementById("fleet-landing-table")
    .replaceChildren(...(columns.length ? [fleetLandingTable(columns, series)] : []));

  document.getElementById("fleet-gaps").replaceChildren(fleetGaps(fleet));
  document.getElementById("fleet-archive").replaceChildren(fleetArchive(fleet));
  document.getElementById("fleet-mirror").replaceChildren(fleetMirror(fleet));
}

/* ------------------------------------------------------------------------
 * The ask box: a ranked search over the summaries this refresh already read.
 *
 * The one control on this page whose answer is not already in the payload — and it
 * is still not a fetch into the archive. /api/ask ranks an in-memory corpus the
 * refresh mirrored, with the same rubric, the same order and the same scrub
 * `qanungo ask` uses, so a hit here and a hit in the terminal are the same hit.
 *
 * Three things this file does not do. It does not rank, score, or re-order: the
 * server sends the hits in their final order and this writes them out. It does not
 * scope: the search covers all of history and is deliberately independent of the
 * repository, device and harness controls above, which the note under the box says
 * out loud rather than leaving a reader to assume either way. And it makes no link
 * — the citation is a hash rendered as selectable text, because the archive behind
 * it serves unredacted blobs.
 * ------------------------------------------------------------------------ */

/* How many hits to ask for. The server clamps whatever it is handed and echoes back
   what it used, so this is a preference and never a trusted number. */
const ASK_LIMIT = 10;

/* The last answer, and the state around it. Module state rather than storage: a
   search is a question asked once, not a preference, and it survives an SSE refresh
   because `paint` re-renders it rather than clearing it — with the note saying which
   refresh answered, so a stale answer is dated instead of quietly re-labelled. */
let askAnswer = null;
let askError = null;
let asking = false;

async function runAsk() {
  const field = document.getElementById("ask-query");
  const typed = field.value;
  asking = true;
  askError = null;
  paintAsk();
  try {
    const response = await fetch(
      "/api/ask?q=" + encodeURIComponent(typed) + "&limit=" + ASK_LIMIT,
      { cache: "no-store" }
    );
    const body = await response.json();
    if (!response.ok) {
      askAnswer = null;
      askError = body.error || "the search came back " + response.status;
    } else {
      askAnswer = body;
    }
  } catch (error) {
    askAnswer = null;
    askError = "could not reach the search: " + error.message;
  }
  asking = false;
  paintAsk();
}

/* One hit. Every string was scrubbed server-side on its way into the ranking and is
   written here as text, markers and all — a reader has to be able to see the scrub
   fired, exactly as in the standup section. */
function askHitNode(hit) {
  const card = el("div", "hit");
  card.appendChild(el("h4", null, hit.rank + ". " + hit.title));
  const meta = [
    hit.harness,
    hit.repository || "no repository recorded",
    hit.branch ? "branch " + hit.branch : null,
    "archived " + (hit.archived_at || "at an unreadable time") + " (UTC)",
    "score " + hit.score,
  ]
    .filter(Boolean)
    .join(" · ");
  card.appendChild(el("div", "hit-meta", meta));
  card.appendChild(el("div", "hit-snippet", hit.snippet));
  card.appendChild(el("p", "hit-why", "Matched in " + hit.matched.join(", ") + "."));
  card.appendChild(el("div", "hit-cite", "sha256:" + hit.source_hash));
  return card;
}

/* What the box says about itself: what it searched, what it could not, which refresh
   answered, and — when the page has moved on since — that the answer is older than
   the numbers around it. */
function askSentence(answer) {
  const scrub = answer.redaction.secrets
    ? answer.redaction.total
      ? "Scrubbed for secrets (pattern set " +
        answer.redaction.pattern_revision +
        "); " +
        answer.redaction.total +
        " replacements were made."
      : /* Not "nothing matched": that is the sentence the *search* uses for its own
           answer, and one line carrying both would be two claims wearing one word. */
        "Scrubbed for secrets (pattern set " +
        answer.redaction.pattern_revision +
        "); no pattern fired."
    : "SERVED RAW: this dashboard was started with --no-redact, so nothing below was scrubbed.";
  const unsearchable = answer.unsearchable
    ? " " +
      answer.unsearchable +
      (answer.unsearchable === 1 ? " session carries" : " sessions carry") +
      " no summary this build could read and could not be searched — counted, not dropped."
    : "";
  const aged =
    current && current.provenance.generation !== answer.corpus.generation
      ? " These results are from refresh " +
        answer.corpus.generation +
        "; the page is now on " +
        current.provenance.generation +
        " — search again to rank the current corpus."
      : "";
  const stale = answer.corpus.stale_since
    ? " The corpus itself is from " +
      answer.corpus.read_at +
      "; every refresh since " +
      answer.corpus.stale_since +
      " has failed."
    : "";
  const terms = answer.query.terms.length
    ? "Searched " +
      answer.searched +
      " sessions across all of the archive's history for " +
      answer.query.terms.map((term) => "“" + term + "”").join(", ") +
      ". Words shorter than " +
      answer.query.min_term_chars +
      " characters and very common ones are dropped before ranking."
    : "";
  return [terms, unsearchable, aged, stale, " " + scrub].filter(Boolean).join("");
}

function paintAsk() {
  const note = document.getElementById("ask-note");
  const results = document.getElementById("ask-results");
  document.getElementById("ask-submit").disabled = asking;

  if (asking) {
    note.textContent = "Searching the summaries this refresh read…";
    return;
  }
  if (askError) {
    note.textContent = askError;
    results.replaceChildren();
    return;
  }
  if (!askAnswer) {
    note.textContent =
      "A deterministic search over every session's own summary — all of the archive's history, " +
      "ranked by a fixed rubric and not by a model. It is not narrowed by the scope controls " +
      "above, and it never reaches into the archive: it ranks the summaries this refresh already " +
      "read. Each hit cites the summary's content hash; take that to your own shell to read the " +
      "session in full.";
    results.replaceChildren();
    return;
  }

  if (askAnswer.state === "no-searchable-terms") {
    note.textContent =
      "That query has no word to search on: everything in it is either shorter than " +
      askAnswer.query.min_term_chars +
      " characters or a very common word the search drops. Try a more specific term — a " +
      "repository name, an API, a file, a feature.";
    results.replaceChildren();
    return;
  }

  note.textContent = askSentence(askAnswer);
  if (askAnswer.state === "no-matches") {
    results.replaceChildren(
      el(
        "p",
        "empty",
        "No session's summary matched. That is the archive's answer, not a truncation — nothing " +
          "was ranked and hidden."
      )
    );
    return;
  }

  const nodes = askAnswer.hits.map(askHitNode);
  const shown =
    askAnswer.total_matches > askAnswer.hits.length
      ? "Showing the " +
        askAnswer.hits.length +
        " best of " +
        askAnswer.total_matches +
        " matches, ranked by how much of the query each summary carries — title weighs most, " +
        "then repository and tags. This is a search, not a judgement of the work."
      : askAnswer.total_matches +
        (askAnswer.total_matches === 1 ? " session matched" : " sessions matched") +
        ", ranked by how much of the query each summary carries — title weighs most, then " +
        "repository and tags. This is a search, not a judgement of the work.";
  results.replaceChildren(el("p", "note", shown), ...nodes);
}

function wireAskControls() {
  document.getElementById("ask-form").addEventListener("submit", (event) => {
    /* Nothing to navigate to: this page has no links and makes no requests but its
       own. The default submit would reload the page and lose the payload in hand. */
    event.preventDefault();
    runAsk();
  });
}

/* The pre-folded scope the reader chose, or null for the whole window. Looked up by
   label rather than by position, so a refresh that reorders the list (it is ordered
   busiest-first) cannot silently move a selection onto a different repository or device.

   The two primary axes are exclusive, and a device wins if both are somehow set — the
   same precedence the controls and the remembered scope enforce — so this never has to
   invent a repository × device cell the payload does not carry. A device scope and a
   repository scope have the identical shape (lanes, timeline, sessions, findings); they
   differ only in which label key they carry, which `primaryLabel` reads. */
function chosenScope(data) {
  if (scope.device !== null) {
    return data.scopes.devices.find((entry) => entry.device === scope.device) || null;
  }
  if (scope.repository !== null) {
    return (
      data.scopes.repositories.find((entry) => entry.repository === scope.repository) || null
    );
  }
  return null;
}

/* The label of whichever primary axis an entry belongs to. A repository scope carries
   `repository`, a device scope carries `device`; the whole-window entry is null. */
function primaryLabel(entry) {
  if (!entry) return null;
  return entry.repository !== undefined ? entry.repository : entry.device;
}

/* Whether the active primary scope is a repository — the only axis the bill and the
   narrative are cut by. A device scope narrows the scores, the timeline and the findings
   (every session it holds is device-tagged), but the cost lane groups by repository and
   the standup by the repository a summary names, and neither carries a host, so under a
   device the two sections stay at the whole window. */
function scopeIsRepository(entry) {
  return Boolean(entry) && entry.repository !== undefined;
}

function chosenColumn(data) {
  return scope.harness === null ? -1 : data.scopes.harnesses.indexOf(scope.harness);
}

/* The two selects, rebuilt from the payload on every fetch. An option's value is its
   position in the payload's own array and its text is the label; the selection itself
   is held as a label, so an option that stops existing between refreshes falls back to
   "all" instead of quietly becoming its neighbour. */
function fillScopeControls(data) {
  const repositories = document.getElementById("scope-repository");
  const repositoryOptions = [option("", "All repositories")];
  data.scopes.repositories.forEach((entry, index) => {
    repositoryOptions.push(
      option(String(index), entry.repository + " (" + entry.sessions.folded + ")")
    );
  });
  repositories.replaceChildren(...repositoryOptions);
  const chosenRepository = data.scopes.repositories.findIndex(
    (entry) => entry.repository === scope.repository
  );
  if (scope.repository !== null && chosenRepository < 0) scope.repository = null;
  repositories.value = chosenRepository >= 0 ? String(chosenRepository) : "";

  const devices = document.getElementById("scope-device");
  const deviceOptions = [option("", "All devices")];
  data.scopes.devices.forEach((entry, index) => {
    deviceOptions.push(
      option(String(index), entry.device + " (" + entry.sessions.folded + ")")
    );
  });
  devices.replaceChildren(...deviceOptions);
  const chosenDevice = data.scopes.devices.findIndex(
    (entry) => entry.device === scope.device
  );
  if (scope.device !== null && chosenDevice < 0) scope.device = null;
  devices.value = chosenDevice >= 0 ? String(chosenDevice) : "";

  const harnesses = document.getElementById("scope-harness");
  const harnessOptions = [option("", "All harnesses (fleet)")];
  data.scopes.harnesses.forEach((label, index) => {
    harnessOptions.push(option(String(index), label));
  });
  harnesses.replaceChildren(...harnessOptions);
  const chosenHarness = chosenColumn(data);
  if (scope.harness !== null && chosenHarness < 0) scope.harness = null;
  harnesses.value = chosenHarness >= 0 ? String(chosenHarness) : "";
}

function option(value, text) {
  const node = el("option", null, text);
  node.value = value;
  return node;
}

function labelAt(labels, raw) {
  if (raw === "") return null;
  const index = Number(raw);
  return Number.isInteger(index) && index >= 0 && index < labels.length ? labels[index] : null;
}

/* How many folded sessions the chosen scope actually holds — the denominator every
   count on the page is "of".
 *
 * A harness selection narrows the sessions too, so the whole window's total is the
 * wrong number to divide by whenever one is picked: the per-harness counts are in
 * `by_harness`, keyed by the same label the control is built from, so this reads one
 * rather than deriving it. `0` for a harness that contributed nothing to the scope is
 * a real answer and is what makes "0 of 0" say what it means. */
function scopedFolded(data, entry, column) {
  const base = entry ? entry.sessions : data.sessions;
  if (column < 0) return base.folded;
  return base.by_harness[data.scopes.harnesses[column]] || 0;
}

function scopeSentence(data, entry, column) {
  if (!entry && column < 0) {
    return (
      "Showing the whole window. Choose a repository or a device to narrow the scores, the " +
      "timeline and the findings — and, for a repository, the bill and the narrative too — or a " +
      "harness to cut any of those by harness. Repository and device are alternatives: picking " +
      "one clears the other, because the payload holds no repository-and-device combination. " +
      "Every scope is folded server-side and shipped with this payload; nothing here recomputes " +
      "a score."
    );
  }
  const onDevice = Boolean(entry) && !scopeIsRepository(entry);
  const parts = [];
  if (entry) parts.push(primaryLabel(entry));
  if (column >= 0) parts.push(data.scopes.harnesses[column]);
  let sentence =
    "Scoped to " +
    parts.join(" · ") +
    " — " +
    scopedFolded(data, entry, column) +
    " of " +
    data.sessions.folded +
    " folded sessions. ";
  sentence +=
    column >= 0
      ? "A harness scope shows that harness's own score rather than the fleet blend, and narrows " +
        "the findings to its sessions. The bill and the narrative carry no harness cut."
      : "Fleet inside a scope is the unweighted mean over the harnesses present in that scope, " +
        "under the same roster rule as the whole window.";
  if (onDevice) {
    sentence +=
      " This is the device the capture ran on. It narrows the scores, the timeline and the " +
      "findings; the bill is grouped by repository and the narrative by the repository a summary " +
      "names, and neither carries a host, so both stay at the whole window below.";
  }
  if (entry && entry.sessions.folded === 0) {
    sentence += onDevice
      ? " No coaching session in this window ran on this device, so the lanes above have nothing " +
        "to read."
      : " No coaching session in this window was listed under this repository — it is on the " +
        "list because the bill or the narrative names it — so the lanes above have nothing to " +
        "read.";
  }
  return sentence;
}

function paint() {
  const data = current;
  if (!data) return;
  const provenance = data.provenance;
  const entry = chosenScope(data);
  const column = chosenColumn(data);
  const scopedSessions = entry ? entry.sessions : data.sessions;
  const folded = scopedFolded(data, entry, column);
  // With a harness picked, the split below it is that one harness — listing the others
  // beside a count that excludes them would be two numbers describing different sets.
  const harnesses = Object.entries(scopedSessions.by_harness)
    .filter(([name]) => column < 0 || name === data.scopes.harnesses[column])
    .map(([name, count]) => name + " (" + count + ")")
    .join(", ");
  document.getElementById("subtitle").textContent =
    "Scored over the last " +
    data.window.last +
    " — " +
    folded +
    " sessions since " +
    data.window.opens_at +
    " (UTC)" +
    (harnesses ? " — " + harnesses : "") +
    ". Cost covers the last " +
    data.cost.window.last +
    " and the standup the last " +
    data.standup.window.last +
    "; each section says which.";
  document.getElementById("scope-note").textContent = scopeSentence(data, entry, column);
  /* Re-rendered with the rest of the page so an answer taken over an older refresh is
     dated rather than left looking current. The scope has no say in it — the search is
     all of history, and the note under the box says so. */
  paintAsk();

  if (provenance.stale_since) {
    banner(
      "These numbers are from " +
        provenance.refreshed_at +
        "; every refresh since " +
        provenance.stale_since +
        " has failed. Nothing below has been recomputed."
    );
  } else {
    banner("");
  }

  const lanes = entry ? entry.lanes : data.lanes;
  document
    .getElementById("tiles")
    .replaceChildren(...lanes.map((lane) => laneTile(lane, column)));

  paintTimeline(data, entry, column);
  paintHeatmap(data, entry, column);
  paintFleet(data, entry, column);

  const findings = document.getElementById("findings");
  const cards = data.findings
    .map((finding) => ({ finding, cited: finding.evidence.filter(citedInScope) }))
    .filter(({ cited }) => cited.length > 0)
    .map(({ finding, cited }) => findingCard(finding, cited, folded));
  if (cards.length === 0) {
    findings.replaceChildren(
      el(
        "p",
        "empty",
        entry || column >= 0
          ? "No rule fired in this scope. The thresholds are first guesses, so a quiet scope is " +
            "as much a statement about them as about the work."
          : "Nothing crossed a rule threshold this window. The thresholds are first guesses, so a " +
            "quiet window is as much a statement about them as about the work."
      )
    );
  } else {
    findings.replaceChildren(...cards);
  }

  // Only a repository narrows the bill and the narrative — a device does not, so under a device
  // scope (or none) these stay whole-window. See `scopeIsRepository`.
  const byRepository = scopeIsRepository(entry);
  document
    .getElementById("cost")
    .replaceChildren(
      ...(byRepository
        ? scopedCostSection(data.cost, entry.repository, data.scopes.unattributed)
        : costSection(data.cost))
    );
  document
    .getElementById("standup")
    .replaceChildren(
      ...(byRepository
        ? scopedStandupSection(data.standup, entry.repository)
        : standupSection(data.standup)),
      el("p", "note", standupScrubNote(data.standup, provenance.redaction))
    );

  const footer = document.getElementById("provenance");
  const gaps = provenance.gaps
    .map((gap) => gap.count + " — " + gap.reason)
    .join("; ");
  const lines = [
    "Scores are a function of the rule pack stamped below and of nothing else, so two windows " +
      "compare only when that stamp matches. 100 means nothing this pack penalizes was observed, " +
      "not that the practice is perfect. Scores move across windows; they do not compare across " +
      "lanes. Fleet is the unweighted mean of the per-harness scores, and carries an arrow only " +
      "when the same harnesses scored the lane in both windows.",
    "The scores and the cost above are aggregates, rule ids, counts and transcript content " +
      "hashes; a finding will expand into the individual events that rule counted, one event " +
      "each. The standup is the archive's own prose, " +
      (provenance.redaction.secrets
        ? "scrubbed for secrets by pattern set " + provenance.redaction.pattern_revision
        : "SERVED RAW: this dashboard was started with --no-redact") +
      ". Nothing else from a transcript is served, and there is no link into the archive. To " +
      "read a whole session, take its hash to your own shell.",
    "Coaching " +
      provenance.window +
      " · " +
      provenance.sessions_folded +
      " sessions (+" +
      provenance.comparison_sessions_folded +
      " comparison) of " +
      provenance.sessions_listed +
      " listed · sync " +
      provenance.sync +
      " · fold " +
      provenance.fold +
      " · " +
      provenance.bytes_folded +
      " folded · cache " +
      provenance.cache_hits +
      " hits / " +
      provenance.cache_misses +
      " misses (" +
      provenance.bytes_transferred +
      " transferred)",
    "Cost " +
      provenance.lanes.cost.window +
      " · " +
      provenance.lanes.cost.sessions_folded +
      " sessions (+" +
      provenance.lanes.cost.comparison_sessions_folded +
      " comparison) · " +
      provenance.lanes.cost.records_read +
      " records · sync " +
      provenance.lanes.cost.sync +
      " · fold " +
      provenance.lanes.cost.fold,
    "Standup " +
      provenance.lanes.standup.window +
      " · " +
      provenance.lanes.standup.sessions_folded +
      " sessions · " +
      provenance.lanes.standup.bytes_folded +
      " read · sync " +
      provenance.lanes.standup.sync +
      " · fold " +
      provenance.lanes.standup.fold,
    /* The search lane names a scope rather than a window: it covers all of history, so
       there is no duration to print and printing one would be printing a wrong one. */
    "Ask " +
      provenance.ask_scope +
      " · " +
      provenance.lanes.ask.sessions_searchable +
      " of " +
      provenance.lanes.ask.sessions_listed +
      " listed sessions searchable (" +
      provenance.lanes.ask.sessions_unsearchable +
      " not) · " +
      provenance.lanes.ask.bytes_read +
      " held · sync " +
      provenance.lanes.ask.sync +
      " · fold " +
      provenance.lanes.ask.fold,
    "Rule pack " +
      provenance.rule_pack +
      " · price table " +
      provenance.price_table_revision +
      " · redaction patterns " +
      provenance.redaction_pattern_revision +
      " · refresh " +
      provenance.generation +
      " at " +
      provenance.refreshed_at +
      " in " +
      provenance.refresh_elapsed +
      ", every " +
      provenance.refresh_interval,
  ];
  if (gaps) lines.push("Gaps — " + gaps);
  const nodes = lines.map((line) => el("p", null, line));
  nodes.push(el("p", "archive", "Archive " + provenance.patwari_url + " · cache " + provenance.cache_root));
  footer.replaceChildren(...nodes);
}

function render(data) {
  current = data;
  fillScopeControls(data);
  paint();
}

/* Changing the scope re-renders from the payload already in hand. It fetches nothing:
   every scope was folded before this document was published, which is the whole reason
   there is no query string on this route.

   `changed` names the control the reader just touched. Repository and device are the two
   exclusive primary axes: whichever one was just set to a value wins, and the other is
   cleared in both the model and the DOM, so the controls never offer a repository-and-
   device pair the payload does not carry. Harness is the free sub-axis and clears
   neither. */
function applyScope(changed) {
  if (!current) return;
  const repoSelect = document.getElementById("scope-repository");
  const deviceSelect = document.getElementById("scope-device");
  scope.repository = labelAt(
    current.scopes.repositories.map((entry) => entry.repository),
    repoSelect.value
  );
  scope.device = labelAt(
    current.scopes.devices.map((entry) => entry.device),
    deviceSelect.value
  );
  scope.harness = labelAt(
    current.scopes.harnesses,
    document.getElementById("scope-harness").value
  );
  if (changed === "repository" && scope.repository !== null) {
    scope.device = null;
    deviceSelect.value = "";
  } else if (changed === "device" && scope.device !== null) {
    scope.repository = null;
    repoSelect.value = "";
  }
  rememberScope();
  paint();
}

function wireScopeControls() {
  document
    .getElementById("scope-repository")
    .addEventListener("change", () => applyScope("repository"));
  document
    .getElementById("scope-device")
    .addEventListener("change", () => applyScope("device"));
  document
    .getElementById("scope-harness")
    .addEventListener("change", () => applyScope("harness"));
  document.getElementById("scope-reset").addEventListener("click", () => {
    document.getElementById("scope-repository").value = "";
    document.getElementById("scope-device").value = "";
    document.getElementById("scope-harness").value = "";
    applyScope("reset");
  });
  /* Changing the measure redraws from the payload in hand, exactly as changing the
     scope does. Both series were folded before this document was published; the
     toggle picks which of the two integers already on the page becomes a height. */
  document.getElementById("timeline-measure").addEventListener("change", (event) => {
    measure = event.target.value === "active" ? "active" : "sessions";
    paint();
  });
  /* The heatmap's own measure, on its own state, so the two views do not move
     together. Same reasoning as the timeline's toggle: both integers were folded
     before the document was published; this picks which one becomes intensity. */
  document.getElementById("heatmap-measure").addEventListener("change", (event) => {
    heatMeasure = event.target.value === "active" ? "active" : "sessions";
    paint();
  });
}

async function load() {
  const response = await fetch("/api/data", { cache: "no-store" });
  if (!response.ok) throw new Error("the payload came back " + response.status);
  const data = await response.json();
  generation = data.provenance.generation;
  render(data);
}

async function reload() {
  try {
    await load();
  } catch (error) {
    banner("Could not reach the qanungo dashboard: " + error.message);
  }
}

function subscribe() {
  const events = new EventSource("/api/events");
  events.addEventListener("refresh", (event) => {
    let notice;
    try {
      notice = JSON.parse(event.data);
    } catch (error) {
      return;
    }
    // The stream sends the current generation on connect too, so a reconnecting
    // page takes the same path as a refreshing one and re-fetches only when the
    // fold behind the payload actually moved.
    if (notice.generation !== generation) reload();
  });
  events.addEventListener("error", () => {
    banner("Lost the refresh stream; reconnecting.");
  });
  // Nothing is re-fetched here: the stream's first event carries the server's
  // current generation, so a server that restarted announces itself and a
  // connection that merely dropped costs one comparison.
  events.addEventListener("open", () => banner(""));
}

scope = readRememberedScope();
wireScopeControls();
wireAskControls();
/* The ask box says what it is before the payload lands: it is answered by its own
   route and does not wait on the document above it. */
paintAsk();
reload().then(subscribe);
</script>
</body>
</html>
