<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>qanungo — practice, cost, standup</title>
<style>
/*
 * One file, no assets, no fonts, no network but this server's own two routes.
 *
 * Colours are roles, defined once for light and re-defined once for dark, so the
 * page follows the reader's system setting on a laptop, a phone, and a TV without
 * asking anybody to choose. Sizes are clamped against the viewport rather than
 * fixed: the same page has to be legible held in one hand and across a room.
 */
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --rule: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --up: #006300;
  --down: #d03b3b;
  --warn-surface: #fdf3d8;
  --warn-ink: #5c4405;
  /*
   * The chart's categorical slots, in fixed order. Colour follows the harness, never
   * its rank: a slot is the harness's index in the payload's one harness axis
   * (`scopes.harnesses`), which is the same list in every scope, so narrowing the
   * page never repaints the series that survive.
   *
   * Three slots and no more. The roster is an allowlist of three harnesses, and
   * three is also where this palette validates on every pair at once — a fourth
   * would put yellow beside orange, which fails colour-blind separation for readers
   * who see the whole chart at a glance. Anything past the third folds into the
   * muted ink rather than becoming a generated hue.
   *
   * Light aqua sits below 3:1 against this surface, so the chart ships the table
   * view below it: identity never rests on colour alone here. Both columns were
   * checked as sets against these two surfaces, not flipped from one another.
   */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --rule: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --up: #0ca30c;
    --down: #d03b3b;
    --warn-surface: #2e2611;
    --warn-ink: #fab219;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: clamp(1rem, 3vw, 3rem);
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: clamp(15px, 0.45vw + 13px, 22px);
  line-height: 1.5;
}
main { max-width: 1600px; margin: 0 auto; }
h1 {
  font-size: clamp(1.35rem, 1.6vw + 0.9rem, 2.2rem);
  font-weight: 650;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}
h2 {
  font-size: 1.05rem;
  font-weight: 650;
  margin: 2.5rem 0 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
}
p { margin: 0 0 0.5rem; }
.sub { color: var(--ink-2); margin: 0 0 1.5rem; }
.banner {
  display: none;
  margin: 0 0 1.5rem;
  padding: 0.7rem 1rem;
  border-radius: 8px;
  background: var(--warn-surface);
  color: var(--warn-ink);
  border: 1px solid var(--border);
}
.banner.shown { display: block; }

/* The scope control. Two selects and a sentence saying what they narrow — small,
   because it is a lens on the page and not a section of it. */
.scope {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.25rem;
  margin: 0 0 0.5rem;
  padding: 0.7rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.scope-field { display: flex; align-items: center; gap: 0.5rem; }
.scope-field label { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.scope select {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--plane);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.3rem 0.5rem;
  max-width: min(100%, 26rem);
}
.scope-reset {
  font: inherit;
  font-size: 0.8rem;
  color: var(--ink-2);
  background: var(--plane);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.scope-note { margin: 0 0 1.5rem; font-size: 0.82rem; color: var(--ink-muted); max-width: 100ch; }

/* The ask box. A search over the summaries this refresh already read — so it is a
   control like the scope selects above it and not a section of the page, and it is
   styled to match them rather than to compete with the score tiles below. */
.ask {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin: 0 0 0.5rem;
}
.ask input {
  flex: 1 1 24rem;
  min-width: 10rem;
  font: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.45rem 0.7rem;
}
.ask button {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.45rem 1.1rem;
  cursor: pointer;
}
.hit {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.8rem, 1.1vw, 1.2rem);
  margin-bottom: 0.6rem;
}
.hit h4 { font-size: 1rem; font-weight: 650; margin: 0 0 0.2rem; max-width: 78ch; }
.hit-meta {
  font-size: 0.75rem;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
  margin-bottom: 0.4rem;
}
.hit-snippet {
  margin: 0.35rem 0 0.5rem;
  padding: 0.35rem 0.7rem;
  border-left: 3px solid var(--rule);
  color: var(--ink-2);
  max-width: 78ch;
}
.hit-why { font-size: 0.78rem; color: var(--ink-muted); margin: 0 0 0.3rem; }
/* The citation. Selectable in one gesture and deliberately not a link: it is a hash
   you take to your own shell, because the archive behind it serves unredacted blobs. */
.hit-cite {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  color: var(--ink-muted);
  overflow-wrap: anywhere;
  user-select: all;
}

/* Five tiles. auto-fit rather than a fixed count: one column on a phone, five
   across a TV, and nothing reflows into a half-empty row in between. */
.tiles {
  display: grid;
  gap: clamp(0.75rem, 1vw, 1.25rem);
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
  /* Each tile is as tall as its own contents. Stretching them to match would let one
     lane's explanation of why it is not scored decide the height of the four beside it. */
  align-items: start;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.9rem, 1.2vw, 1.4rem);
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.tile-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-2);
  text-transform: none;
}
.tile-value {
  font-size: clamp(2.4rem, 3.4vw, 3.6rem);
  font-weight: 650;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.tile-value.unscored {
  font-size: clamp(1rem, 1.2vw, 1.35rem);
  font-weight: 600;
  color: var(--ink-muted);
  line-height: 1.6;
  padding: 0.9rem 0;
}
.delta { font-size: 0.9rem; font-weight: 600; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat, .delta.none { color: var(--ink-muted); font-weight: 500; }
.split {
  margin-top: 0.35rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.split-row {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.85rem;
}
.split-name { color: var(--ink-2); white-space: nowrap; }
.split-score { font-variant-numeric: tabular-nums; white-space: nowrap; }
.reason { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--ink-muted); }

details { margin-top: 0.5rem; }
summary {
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--ink-2);
  padding: 0.2rem 0;
}
.readings { margin: 0.4rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--ink-2); }
.readings li { margin-bottom: 0.25rem; }

.finding {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.9rem, 1.2vw, 1.4rem);
  margin-bottom: clamp(0.75rem, 1vw, 1.25rem);
}
.finding h3 {
  font-size: 1.05rem;
  font-weight: 650;
  margin: 0 0 0.1rem;
}
.finding-count { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 0.75rem; }
.finding dt {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 0.6rem;
}
.finding dd { margin: 0.15rem 0 0; color: var(--ink-2); max-width: 68ch; }
.hashes {
  margin: 0.4rem 0 0;
  padding: 0;
  list-style: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  color: var(--ink-2);
  max-height: 16rem;
  overflow-y: auto;
  overflow-x: auto;
}
.empty { color: var(--ink-2); }

/* Evidence. A finding's sessions are a scrolling column of collapsed rows; opening one
   is what fetches it, so a window with sixty firing sessions costs sixty summaries and
   nothing else until somebody asks. */
.sessions { margin-top: 0.4rem; max-height: 24rem; overflow-y: auto; }
.session { border-top: 1px solid var(--rule); }
.session > summary {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}
.excerpt {
  margin: 0.35rem 0 0.6rem;
  padding: 0.5rem 0.7rem;
  border-left: 3px solid var(--rule);
  font-size: 0.82rem;
}
.excerpt-where {
  color: var(--ink-muted);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
}
.excerpt-field {
  margin: 0.25rem 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 14rem;
  overflow-y: auto;
}
.excerpt-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 0.4rem;
}
.excerpt.failed { border-left-color: var(--down); }
.excerpt-note { color: var(--ink-muted); font-size: 0.75rem; margin-top: 0.3rem; }

/* Structural evidence: the shape of the work, drawn from timestamps only. */
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.25rem;
  margin: 0.4rem 0 0.5rem;
  font-size: 0.82rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.sitting-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.2rem;
  font-size: 0.75rem;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}
.sitting-when { white-space: nowrap; }
.sitting-track { flex: 1 1 6rem; min-width: 4rem; height: 0.55rem; background: var(--rule); border-radius: 3px; }
.sitting-bar { height: 100%; background: var(--ink-2); border-radius: 3px; min-width: 2px; }

/* The timeline. One chart, one axis, and a control that changes what is measured
   rather than adding a second scale to the same plot — two y-scales on one plot
   invent a correlation the data does not have. The chart is inline SVG built in
   this file: a dozen-odd columns is not a charting library. */
.chart-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.25rem;
  margin: 0 0 0.6rem;
}
.chart-controls label { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.chart-controls select {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--plane);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.3rem 0.5rem;
}
/* Two or more series always carry a legend: identity must never rest on colour
   alone. One series carries none — the heading above already names it. */
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; font-size: 0.8rem; color: var(--ink-2); }
.legend-item { display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
.legend-swatch { width: 0.7rem; height: 0.7rem; border-radius: 2px; flex: none; }
.legend-swatch.s0 { background: var(--series-1); }
.legend-swatch.s1 { background: var(--series-2); }
.legend-swatch.s2 { background: var(--series-3); }
.legend-swatch.sx { background: var(--ink-muted); }
/* The chart scrolls sideways inside its own box rather than shrinking: squeezing a
   sixty-day window into a phone's width would take the axis text with it. */
.chart-frame {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.6rem, 1vw, 1rem);
}
.chart { display: block; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .axis-text { fill: var(--ink-muted); font-size: 10px; font-family: inherit; }
.chart .boundary { stroke: var(--ink-muted); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .s0 { fill: var(--series-1); }
.chart .s1 { fill: var(--series-2); }
.chart .s2 { fill: var(--series-3); }
/* Past the third slot a series is drawn in the de-emphasis ink rather than in a
   hue this palette never validated. The roster is an allowlist of three, so this
   is a guard and not a plan. */
.chart .sx { fill: var(--ink-muted); }

/* The heatmap. Unlike the timeline it colours by *intensity, not identity*: one
   hue at a fill-opacity set from the cell's magnitude, so a darker cell is a
   busier local hour. The opacity is the only per-cell number this file writes;
   the hue is the stylesheet's, so it stays theme-aware. Empty cells carry the
   rule colour so seven rows of twenty-four read as a grid rather than as floating
   marks. The per-harness split is not in the colour — it is in the tooltip and
   the table — because stacking here would fight the intensity the grid is for. */
.heat { display: block; }
.heat .cell { fill: var(--series-1); stroke: var(--surface); stroke-width: 1; }
.heat .cell.empty { fill: var(--rule); fill-opacity: 1; }
.heat .hit { fill: transparent; }
.heat .axis-text { fill: var(--ink-muted); font-size: 10px; font-family: inherit; }
/* The intensity legend: a low-to-high strip of the one hue, so a reader knows the
   colour is a quantity. Swatches wear the series colour and vary only in opacity,
   which the script sets inline from the same floor the cells use. */
.heat-scale { display: flex; align-items: center; gap: 0.3rem; font-size: 0.78rem; color: var(--ink-2); }
.heat-swatch { width: 0.85rem; height: 0.85rem; border-radius: 2px; background: var(--series-1); flex: none; }

/* The cost section. A headline, then tables — which are the honest shape for a
   priced breakdown and the one the CLI already uses, so a reader comparing the two
   is comparing rows to rows. Each table scrolls inside its own box rather than
   letting the page scroll sideways on a phone. */
.headline {
  font-size: clamp(1.6rem, 2.4vw, 2.4rem);
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0 0 0.2rem;
}
.headline-sub { color: var(--ink-2); margin: 0 0 0.75rem; }
.note { color: var(--ink-2); font-size: 0.85rem; max-width: 78ch; margin: 0 0 0.75rem; }
.scroller { overflow-x: auto; margin: 0.75rem 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
caption {
  caption-side: top;
  text-align: left;
  font-weight: 650;
  padding-bottom: 0.35rem;
}
th, td {
  padding: 0.35rem 0.7rem 0.35rem 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  white-space: nowrap;
}
th { color: var(--ink-muted); font-weight: 600; font-size: 0.78rem; }
td.figure, th.figure { text-align: right; font-variant-numeric: tabular-nums; }
td.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
.flags { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--ink-2); }
.flags li { margin-bottom: 0.3rem; max-width: 78ch; }

/* The standup section: the archive's own prose, scrubbed. Sessions read like a
   document rather than a dashboard, because that is what they are. */
.repo { margin-bottom: 1.75rem; }
.repo h3 {
  font-size: 0.95rem;
  font-weight: 650;
  margin: 0 0 0.6rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(0.8rem, 1.1vw, 1.2rem);
  margin-bottom: 0.6rem;
}
.session-card h4 { font-size: 1rem; font-weight: 650; margin: 0 0 0.2rem; max-width: 78ch; }
.session-meta {
  font-size: 0.75rem;
  color: var(--ink-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap: anywhere;
  margin-bottom: 0.5rem;
}
.session-goal { color: var(--ink-2); max-width: 78ch; margin: 0 0 0.4rem; }
.work { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; color: var(--ink-2); }
.work li { margin-bottom: 0.2rem; max-width: 78ch; }
.rollup { margin: 0.4rem 0 0; padding-left: 1.1rem; }
.rollup li { margin-bottom: 0.35rem; max-width: 78ch; }
.rollup .where {
  color: var(--ink-muted);
  font-size: 0.78rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Pipeline health. Counts, times and device labels — the one section with no reading
   that could be a score, so it is styled as a status board rather than as a lane:
   plain tables, one flag colour, and a chart with the same marks as the timeline. */
.fleet-block { margin: 0 0 1.25rem; }
.fleet-block h3 {
  font-size: 0.95rem;
  font-weight: 650;
  margin: 0 0 0.25rem;
  color: var(--ink-2);
}
/* The row for the device the reader scoped to. A left rule and weight, never colour
   alone: the same identity rule the chart legend is held to. */
tr.scoped td { font-weight: 650; }
tr.scoped td:first-child { box-shadow: inset 3px 0 0 var(--series-1); }
/* A device nobody has heard from in a while. Weight and a word, and the exact time is
   in the column beside it, because "silent" is a flag and not a verdict. */
.silent { color: var(--down); font-weight: 650; }

footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.82rem;
  color: var(--ink-muted);
}
footer p { margin: 0 0 0.3rem; max-width: 100ch; }
footer .archive { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Practice scores</h1>
  <p class="sub" id="subtitle">Loading the fold…</p>
  <div class="banner" id="banner"></div>

  <div class="scope" id="scope">
    <div class="scope-field">
      <label for="scope-repository">Repository</label>
      <select id="scope-repository"></select>
    </div>
    <div class="scope-field">
      <label for="scope-device">Device</label>
      <select id="scope-device"></select>
    </div>
    <div class="scope-field">
      <label for="scope-harness">Harness</label>
      <select id="scope-harness"></select>
    </div>
    <button type="button" class="scope-reset" id="scope-reset">Whole window</button>
  </div>
  <p class="scope-note" id="scope-note"></p>

  <!--
    Pipeline health. Which machines are reporting, what landed on which day, what did
    not arrive whole, how much is in the archive, and what this mirror is holding.

    Aggregates only, by construction: counts, timestamps, byte sizes, device labels
    and harness names. There is no transcript text and no summary text in this
    section's payload at all, so there is nothing here for this file to leak — see
    `crate::fleet`, which builds it, and the canary test that walks it.

    Every number was folded server-side with the rest of the payload. This section, like
    every other one, reads fields and scales them into pixels.
  -->
  <section aria-labelledby="fleet-heading">
    <h2 id="fleet-heading">Pipeline health</h2>
    <p class="note" id="fleet-note"></p>
    <div class="fleet-block" id="fleet-devices"></div>
    <div class="fleet-block">
      <h3>Landing</h3>
      <div class="legend" id="fleet-landing-legend"></div>
      <div class="chart-frame">
        <svg id="fleet-landing-chart" class="chart" role="img" aria-labelledby="fleet-landing-title fleet-landing-desc">
          <title id="fleet-landing-title"></title>
          <desc id="fleet-landing-desc"></desc>
        </svg>
      </div>
      <p class="note" id="fleet-landing-note"></p>
      <div id="fleet-landing-table"></div>
    </div>
    <div class="fleet-block" id="fleet-gaps"></div>
    <div class="fleet-block" id="fleet-archive"></div>
    <div class="fleet-block" id="fleet-mirror"></div>
  </section>

  <!--
    The ask box. A <form> so Enter submits it the way a search box should, with the
    submit prevented in script: there is nothing to navigate to, and this page has no
    links at all. It asks this server's own /api/ask, which ranks the summaries the
    refresh already read — a request never reaches the archive.
  -->
  <section aria-labelledby="ask-heading">
    <h2 id="ask-heading">Ask your history</h2>
    <form class="ask" id="ask-form">
      <label for="ask-query" class="tile-label">Search the summaries</label>
      <input
        id="ask-query"
        type="search"
        autocomplete="off"
        placeholder="a repository, an API, a feature — “redaction”, “price table”"
      >
      <button type="submit" id="ask-submit">Search</button>
    </form>
    <p class="note" id="ask-note"></p>
    <div id="ask-results"></div>
  </section>

  <section aria-labelledby="lanes-heading">
    <h2 id="lanes-heading">Five lanes</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <!--
    The timeline. The <svg> element is written here rather than created in script for
    one reason worth stating: an element the HTML parser built is already in the SVG
    namespace, so the script reads that namespace off it (`chart.namespaceURI`) and
    this file never has to write a namespace URL down. The page's "loads nothing from
    anywhere" invariant is checked by looking for URLs in it, and a URL that is really
    a namespace would have made that check a judgement call.
  -->
  <section aria-labelledby="timeline-heading">
    <h2 id="timeline-heading">Timeline</h2>
    <div class="chart-controls">
      <label for="timeline-measure">Measure</label>
      <select id="timeline-measure">
        <option value="sessions">Sessions per day</option>
        <option value="active">Active hours per day</option>
      </select>
      <div class="legend" id="timeline-legend"></div>
    </div>
    <div class="chart-frame">
      <svg id="timeline-chart" class="chart" role="img" aria-labelledby="timeline-title timeline-desc">
        <title id="timeline-title"></title>
        <desc id="timeline-desc"></desc>
      </svg>
    </div>
    <p class="note" id="timeline-note"></p>
    <div id="timeline-table"></div>
  </section>

  <!--
    The habits heatmap. Its <svg> is written here for the same reason the timeline's
    is: an element the HTML parser built is already in the SVG namespace, so the
    script reads that namespace off it and this file never writes a namespace URL,
    which keeps the page's "loads nothing from anywhere" check a grep rather than a
    judgement call.
  -->
  <section aria-labelledby="heatmap-heading">
    <h2 id="heatmap-heading">Habits</h2>
    <div class="chart-controls">
      <label for="heatmap-measure">Measure</label>
      <select id="heatmap-measure">
        <option value="sessions">Sessions</option>
        <option value="active">Active hours</option>
      </select>
      <div class="legend" id="heatmap-legend"></div>
    </div>
    <div class="chart-frame">
      <svg id="heatmap-chart" class="heat" role="img" aria-labelledby="heatmap-title heatmap-desc">
        <title id="heatmap-title"></title>
        <desc id="heatmap-desc"></desc>
      </svg>
    </div>
    <p class="note" id="heatmap-note"></p>
    <div id="heatmap-table"></div>
  </section>

  <section aria-labelledby="findings-heading">
    <h2 id="findings-heading">Findings</h2>
    <div id="findings"></div>
  </section>

  <section aria-labelledby="cost-heading">
    <h2 id="cost-heading">Cost</h2>
    <div id="cost"></div>
  </section>

  <section aria-labelledby="standup-heading">
    <h2 id="standup-heading">Standup</h2>
    <div id="standup"></div>
  </section>

  <footer id="provenance"></footer>
</main>
<script>
"use strict";
/*
 * Everything the payload carries is written with textContent, never as markup.
 * Harness labels come out of somebody else's manifest and are already clamped
 * server-side; setting them as text rather than parsing them is the second half
 * of that discipline. No string in this file is ever assigned to a property that
 * would parse it as markup — the elements below are built and their text set.
 *
 * It also contains no links. Patwari serves unredacted blobs, so a deep link
 * from this page into the archive would hand every tailnet device a whole
 * transcript. The only evidence this page can expand is what the payload itself
 * named — one scrubbed event per anchor, from this server's own route — and a
 * whole session is still a hash you take to your own shell.
 */
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};

let generation = null;

/*
 * The scope. Three labels, each null for "everything" — never an index, because the
 * payload's order is busiest-first and a refresh may reorder it, and a remembered
 * position would silently become a different repository or device.
 *
 * Repository and device are the two PRIMARY axes, and they are alternatives: each picks
 * a pre-folded scope out of the payload, but the payload holds no repository × device
 * cell (that pair is a selection no fold produced), so choosing one clears the other.
 * Harness is the free sub-axis — selecting it picks a column out of whichever primary
 * scope is active, a number already there because the scorecard is folded per harness.
 * Nothing here averages, weights, or re-scores anything: this file narrows lists and
 * reads fields.
 */
const SCOPE_KEY = "qanungo.scope";
let current = null;
let scope = { repository: null, device: null, harness: null };

/* Remembering the scope is a convenience for one viewer in one browser, so every
   access is guarded and every failure is silent: a private window, cleared site data,
   or a browser configured to refuse storage must render the page exactly as a fresh
   one does, which is with nothing selected. */
function readRememberedScope() {
  const empty = { repository: null, device: null, harness: null };
  try {
    const raw = window.localStorage.getItem(SCOPE_KEY);
    if (!raw) return empty;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return empty;
    const remembered = {
      repository: typeof parsed.repository === "string" ? parsed.repository : null,
      device: typeof parsed.device === "string" ? parsed.device : null,
      harness: typeof parsed.harness === "string" ? parsed.harness : null,
    };
    /* The two primary axes are exclusive, so a store that somehow holds both (an older
       build, a hand-edited value) is not one this page can render — device wins and the
       repository is dropped, the same precedence the live controls enforce. */
    if (remembered.repository !== null && remembered.device !== null) {
      remembered.repository = null;
    }
    return remembered;
  } catch (error) {
    return empty;
  }
}

function rememberScope() {
  try {
    window.localStorage.setItem(SCOPE_KEY, JSON.stringify(scope));
  } catch (error) {
    /* Storage is unavailable or full. The page is already rendered correctly. */
  }
}

function banner(message) {
  const node = document.getElementById("banner");
  node.textContent = message || "";
  node.classList.toggle("shown", Boolean(message));
}

function deltaNode(trend) {
  if (!trend) {
    return el("div", "delta none", "no comparable window");
  }
  if (trend.direction === "flat") {
    return el("div", "delta flat", "= unchanged from " + trend.was);
  }
  const word = trend.direction === "up" ? "up" : "down";
  return el(
    "div",
    "delta " + trend.direction,
    trend.glyph + " " + word + " " + trend.points + " from " + trend.was
  );
}

function scoreText(entry) {
  if (entry.state === "scored") return String(entry.score);
  if (entry.state === "no-reading") return "no reading";
  if (entry.state === "no-sessions") return "no sessions";
  return "not scored";
}

/* One lane, in the scope the reader chose. `column` is an index into the lane's own
   per-harness array, or -1 for the fleet blend — the payload already holds both, so
   selecting a harness reads a number rather than computing one. */
function laneTile(lane, column) {
  const tile = el("div", "tile");
  tile.appendChild(el("div", "tile-label", lane.title));

  const picked = column >= 0 ? lane.harnesses[column] : null;
  const headline = picked || lane.fleet;
  const scored = headline.state === "scored";
  tile.appendChild(el("div", "tile-value" + (scored ? "" : " unscored"), scoreText(headline)));
  if (scored) tile.appendChild(deltaNode(headline.trend));

  if (picked) {
    tile.appendChild(
      el(
        "div",
        "reason",
        picked.source_agent + " · " + picked.sessions + " sessions in this scope"
      )
    );
  } else {
    const split = el("div", "split");
    for (const harness of lane.harnesses) {
      const row = el("div", "split-row");
      row.appendChild(el("span", "split-name", harness.source_agent));
      let right = scoreText(harness);
      if (harness.state === "scored" && harness.trend) {
        right += " " + harness.trend.glyph;
        if (harness.trend.direction !== "flat") right += " " + harness.trend.points;
      }
      if (harness.sessions) right += " · " + harness.sessions + " sessions";
      row.appendChild(el("span", "split-score", right));
      split.appendChild(row);
    }
    if (lane.harnesses.length) tile.appendChild(split);
  }

  // The sentence naming the pull that would light an unfed lane up is the whole content of
  // "not scored", so it belongs behind the same disclosure a score's readings do — otherwise
  // one lane's paragraph is the loudest thing on the page.
  if (lane.reason) {
    const details = el("details");
    details.appendChild(el("summary", null, "Why it is not scored"));
    details.appendChild(el("p", "reason", lane.reason));
    tile.appendChild(details);
  }

  const readings = (picked ? [picked] : lane.harnesses).flatMap((harness) =>
    (harness.components || []).map((component) => ({ harness, component }))
  );
  if (readings.length) {
    const details = el("details");
    details.appendChild(el("summary", null, "Why this score"));
    const list = el("ul", "readings");
    for (const { harness, component } of readings) {
      const cost =
        component.cost === null || component.cost === undefined
          ? "no say in the score"
          : component.cost.toFixed(1) + " points off";
      list.appendChild(
        el(
          "li",
          null,
          harness.source_agent + " — " + component.label + ": " + component.detail + " — " + cost
        )
      );
    }
    details.appendChild(list);
    tile.appendChild(details);
  }
  return tile;
}

/* One excerpt, as the server scrubbed it. Every field is set as text: the markers a
   redactor leaves are shown as they are, because a reader has to be able to see that
   the scrub fired. */
function excerptNode(excerpt) {
  const node = el("div", "excerpt" + (excerpt.outcome === false ? " failed" : ""));
  const where = [
    excerpt.tool || "unattributed tool",
    excerpt.event,
    excerpt.at,
    "record " + excerpt.record,
    "line " + excerpt.line,
  ]
    .filter(Boolean)
    .join(" · ");
  node.appendChild(el("div", "excerpt-where", where));
  for (const [label, value] of [
    ["Command", excerpt.command],
    ["Error", excerpt.error],
    ["Output", excerpt.output],
  ]) {
    if (value === null || value === undefined || value === "") continue;
    node.appendChild(el("div", "excerpt-label", label));
    node.appendChild(el("pre", "excerpt-field", value));
  }
  const notes = [];
  if (!excerpt.command && !excerpt.error && !excerpt.output) {
    notes.push("this event carried no command, error, or output of its own");
  }
  if (excerpt.truncated) notes.push("cut to fit; the transcript has the rest");
  if (excerpt.redaction.total) {
    notes.push(
      excerpt.redaction.total +
        " redacted (" +
        excerpt.redaction.fired.map((fired) => fired.pattern + " ×" + fired.count).join(", ") +
        ")"
    );
  } else if (!excerpt.redaction.secrets) {
    notes.push("served raw — this dashboard was started with --no-redact");
  }
  if (notes.length) node.appendChild(el("div", "excerpt-note", notes.join(" · ")));
  return node;
}

/* Structural evidence: what a session-shaped rule actually measured. Timestamps and
   counts, and a bar per sitting scaled against the longest one in the same session. */
function structuralNode(structural) {
  const node = el("div");
  const stats = el("div", "stats");
  const pairs = [
    ["active", structural.active.rendered],
    ["span", structural.span.rendered],
    ["longest sitting", structural.longest_sitting.rendered],
    ["sittings", structural.sittings],
    ["user requests", structural.user_requests],
    ["assistant messages", structural.assistant_messages],
    ["tool activities", structural.tool_activities],
  ];
  for (const [label, value] of pairs) {
    if (value === null || value === undefined) continue;
    stats.appendChild(el("span", null, label + " " + value));
  }
  node.appendChild(stats);

  const longest = structural.boundaries.reduce(
    (most, sitting) => Math.max(most, sitting.seconds),
    0
  );
  for (const sitting of structural.boundaries) {
    const row = el("div", "sitting-row");
    row.appendChild(el("span", "sitting-when", sitting.from + " → " + sitting.to));
    const track = el("div", "sitting-track");
    const bar = el("div", "sitting-bar");
    bar.style.width = (longest > 0 ? (sitting.seconds / longest) * 100 : 0) + "%";
    track.appendChild(bar);
    row.appendChild(track);
    row.appendChild(el("span", "sitting-when", sitting.rendered));
    node.appendChild(row);
  }
  if (structural.boundaries_elided > 0) {
    node.appendChild(
      el(
        "div",
        "excerpt-note",
        structural.boundaries_elided + " further sittings are counted above and not drawn"
      )
    );
  }
  return node;
}

async function loadExcerpts(into, sourceHash, anchors) {
  into.replaceChildren(el("div", "excerpt-note", "Fetching " + anchors.length + " excerpts…"));
  const nodes = [];
  for (const anchor of anchors) {
    try {
      const response = await fetch("/api/evidence/" + sourceHash + "/" + anchor.locator, {
        cache: "no-store",
      });
      const body = await response.json();
      if (!response.ok) {
        nodes.push(el("div", "excerpt-note", "No excerpt for " + anchor.locator + ": " + body.detail));
        continue;
      }
      nodes.push(excerptNode(body));
    } catch (error) {
      nodes.push(el("div", "excerpt-note", "Could not fetch the excerpt: " + error.message));
    }
  }
  into.replaceChildren(...nodes);
}

/* One cited session. Collapsed until asked for, and what asking costs is bounded: the
   payload already said which events this row can show, and the server will resolve no
   others. */
function sessionRow(finding, evidence) {
  const row = el("details", "session");
  const anchors = evidence.anchors || [];
  const label =
    "sha256:" +
    evidence.source_hash +
    (anchors.length ? " — " + anchors.length + " counted events" : "");
  row.appendChild(el("summary", null, label));
  const body = el("div");
  if (evidence.structural) body.appendChild(structuralNode(evidence.structural));
  if (anchors.length) {
    const excerpts = el("div");
    body.appendChild(excerpts);
    let fetched = false;
    row.addEventListener("toggle", () => {
      if (!row.open || fetched) return;
      fetched = true;
      loadExcerpts(excerpts, evidence.source_hash, anchors);
    });
  } else if (finding.evidence_kind !== "structural") {
    body.appendChild(
      el(
        "div",
        "excerpt-note",
        "This session's events are counted but not anchored — the fold's per-session anchor " +
          "budget was already spent. The counts above are unaffected."
      )
    );
  }
  row.appendChild(body);
  return row;
}

const EVIDENCE_KIND = {
  event: "the events it counted",
  structural: "what it measured — timestamps and counts, never an utterance",
  // Kind-neutral on purpose: two rules are Mixed and their halves differ. Fire-and-forget
  // anchors failures beside a ratio; unreviewed-ship anchors commits beside an absence.
  mixed: "the events it anchored, and the shape it measured",
};

/* Whether a cited session belongs to the chosen scope. The payload tags every
   evidence row with the repository, device, and harness labels the scopes section groups
   by, so this is a comparison of strings the server wrote — never a rule re-evaluated
   here. Repository and device are exclusive, so at most one of the first two ever
   filters; harness narrows within whichever primary axis is active. */
function citedInScope(evidence) {
  if (scope.repository !== null && evidence.repository !== scope.repository) return false;
  if (scope.device !== null && evidence.device !== scope.device) return false;
  if (scope.harness !== null && evidence.harness !== scope.harness) return false;
  return true;
}

function findingCard(finding, cited, folded) {
  const card = el("div", "finding");
  card.appendChild(el("h3", null, finding.title));
  card.appendChild(
    el(
      "div",
      "finding-count",
      cited.length + " of " + folded + " folded sessions · rule " + finding.rule
    )
  );
  const list = el("dl");
  list.appendChild(el("dt", null, "Problem"));
  list.appendChild(el("dd", null, finding.problem));
  list.appendChild(el("dt", null, "Action"));
  list.appendChild(el("dd", null, finding.action));
  card.appendChild(list);

  /* The Problem and Action sentences are the rule's own, written by the fold over the
     whole window — they are the CLI's wording and the page does not re-word them. Under
     a scope that makes them a wider statement than the count above, and saying so is
     cheaper than a reader deciding the two numbers in one card disagree. */
  if (cited.length !== finding.sessions_affected) {
    card.appendChild(
      el(
        "div",
        "finding-count",
        "The Problem and Action above are the whole window's wording, over all " +
          finding.sessions_affected +
          " sessions the rule fired on. The count and the evidence are this scope's."
      )
    );
  }

  const details = el("details");
  details.appendChild(
    el(
      "summary",
      null,
      "Evidence — " +
        cited.length +
        " sessions, showing " +
        (EVIDENCE_KIND[finding.evidence_kind] || "what the rule saw")
    )
  );
  const sessions = el("div", "sessions");
  for (const evidence of cited) {
    sessions.appendChild(sessionRow(finding, evidence));
  }
  details.appendChild(sessions);
  card.appendChild(details);
  return card;
}

/* A table, built element by element and filled with textContent. `columns` names each
   heading and whether it is a figure; `rows` is an array of cell values already
   rendered server-side, because how a dollar or a token count reads is format.rs's
   job and a second implementation of it here would drift from the CLI. */
function table(caption, columns, rows) {
  const scroller = el("div", "scroller");
  const node = el("table");
  if (caption) node.appendChild(el("caption", null, caption));
  const head = el("tr");
  for (const column of columns) {
    head.appendChild(el("th", column.figure ? "figure" : null, column.label));
  }
  const thead = el("thead");
  thead.appendChild(head);
  node.appendChild(thead);
  const body = el("tbody");
  for (const row of rows) {
    const tr = el("tr");
    row.forEach((value, index) => {
      const column = columns[index];
      const className = column.figure ? "figure" : column.name ? "name" : null;
      tr.appendChild(el("td", className, value));
    });
    body.appendChild(tr);
  }
  node.appendChild(body);
  scroller.appendChild(node);
  return scroller;
}

/* The cost delta, in the three states the payload can be in. ▲ is more money, which
   is a direction and not a verdict — the sentence says so, exactly as the report does. */
function costComparison(comparison, window) {
  if (comparison.state === "no-window") {
    return el("p", "note", "No comparison: " + window + " is too long to place an equal-length window before it.");
  }
  if (comparison.state === "nothing-priced") {
    return el(
      "p",
      "note",
      "No comparison: the archive holds no priced session in the equal-length window before this one, which opened " +
        comparison.opens_at +
        " (UTC)."
    );
  }
  const node = el("p", "delta " + comparison.direction);
  node.textContent =
    comparison.glyph +
    " " +
    comparison.delta_rendered +
    " against the equal-length window before it — " +
    comparison.was_rendered +
    " across " +
    comparison.was_sessions +
    " sessions, from " +
    comparison.opens_at +
    " (UTC). ▲ is more money, not a worse window.";
  return node;
}

/* The bill, cut to one repository.
 *
 * The `By repository` rows are the only cut of the bill the payload holds, so that is
 * the only cut this page will show: a scoped view renders the repository's own row and
 * says plainly which of the window-wide tables below it does not apply to. It does not
 * apportion a model breakdown, a cache saving, or a window-over-window delta across
 * repositories — none of those was computed per repository, and dividing them here
 * would be this file inventing numbers, which is the one thing it does not do.
 */
function scopedCostSection(cost, repository, unattributed) {
  const nodes = [];
  const row = cost.by_repository.find(
    (candidate) =>
      (candidate.repository === null ? unattributed : candidate.repository) === repository
  );
  if (row) {
    nodes.push(el("p", "headline", row.dollars_rendered));
    nodes.push(
      el(
        "p",
        "headline-sub",
        "in " +
          repository +
          " — " +
          row.messages +
          " billed messages and " +
          row.tokens.total.rendered +
          " tokens, of the " +
          cost.priced.dollars_rendered +
          " this window priced in total, archived in the last " +
          cost.window.last +
          " since " +
          cost.window.opens_at +
          " (UTC)."
      )
    );
  } else {
    nodes.push(
      el(
        "p",
        "empty",
        "No session listed under " +
          repository +
          " in the last " +
          cost.window.last +
          " carried usage this build could price. The window as a whole priced " +
          cost.priced.dollars_rendered +
          "."
      )
    );
  }
  nodes.push(
    el(
      "p",
      "note",
      "The repository row above is the only cut of the bill this fold computed. The model " +
        "breakdown, the cache saving, the window-over-window delta, the copilot volumes and the " +
        "unpriced flags are all window-wide, so they are not shown under a repository rather than " +
        "being divided into one — none of them was measured per repository, and apportioning them " +
        "here would be a number nobody computed. Clear the scope to read them."
    )
  );
  return nodes;
}

function costSection(cost) {
  const nodes = [];
  const priced = cost.priced;

  if (priced.priced_anything) {
    nodes.push(el("p", "headline", priced.dollars_rendered));
    nodes.push(
      el(
        "p",
        "headline-sub",
        "across " +
          priced.sessions +
          " claude-code sessions and " +
          priced.messages +
          " billed messages, archived in the last " +
          cost.window.last +
          " since " +
          cost.window.opens_at +
          " (UTC)."
      )
    );
    nodes.push(
      el(
        "p",
        "note",
        "Anthropic API list prices, at the rates in force when each session was archived (price " +
          "table " +
          cost.price_table_revision +
          "). The archive knows which model answered and how many tokens it read and wrote; it " +
          "does not know the account's billing plan, so this is what the usage would list at and " +
          "not necessarily what was charged for it."
      )
    );
    nodes.push(costComparison(cost.comparison, cost.window.last));
  } else {
    nodes.push(
      el(
        "p",
        "empty",
        "No claude-code session in the last " +
          cost.window.last +
          " carried usage this build could price. What the archive did record is below."
      )
    );
  }

  if (cost.by_model.length) {
    nodes.push(
      table(
        null,
        [
          { label: "Model", name: true },
          { label: "Messages", figure: true },
          { label: "Input", figure: true },
          { label: "Output", figure: true },
          { label: "Cache write 5m", figure: true },
          { label: "Cache write 1h", figure: true },
          { label: "Cache read", figure: true },
          { label: "Cost", figure: true },
        ],
        cost.by_model.map((row) => [
          row.model,
          row.messages,
          row.tokens.input.rendered,
          row.tokens.output.rendered,
          row.tokens.cache_write_5m.rendered,
          row.tokens.cache_write_1h.rendered,
          row.tokens.cache_read.rendered,
          row.dollars_rendered,
        ])
      )
    );
  }

  if (cost.caching) {
    let sentence =
      cost.caching.read.rendered +
      " tokens were served from the prompt cache for " +
      cost.caching.read_dollars_rendered +
      ". Sending them as fresh input would have cost " +
      cost.caching.at_input_rate_rendered +
      ", so caching saved " +
      cost.caching.saving_rendered +
      ".";
    if (cost.caching.write_5m || cost.caching.write_1h) {
      sentence +=
        " The writes that filled it are already inside the total above, so this is the read side" +
        " alone and is not net of them.";
    }
    nodes.push(el("p", "note", sentence));
  }

  if (cost.by_repository.length) {
    nodes.push(
      table(
        "By repository",
        [
          { label: "Repository", name: true },
          { label: "Messages", figure: true },
          { label: "Tokens", figure: true },
          { label: "Cost", figure: true },
        ],
        cost.by_repository.map((row) => [
          row.repository === null ? "(no repository)" : row.repository,
          row.messages,
          row.tokens.total.rendered,
          row.dollars_rendered,
        ])
      )
    );
  }

  /* Copilot. The payload hands this page token volumes and no money at all — there is
     no dollar figure here to render, and none is invented. The label says so rather
     than leaving a reader to wonder why one column is missing. */
  if (cost.copilot.rows.length) {
    nodes.push(
      el(
        "p",
        "note",
        "Copilot records output tokens only — one figure per assistant message, with no " +
          "per-message input, cache, or tier — and a transcript does not say whether the account " +
          "was on premium requests or on usage-based credits. These rows are token volumes: no " +
          "dollars, no credit estimate, no premium-request count, and they are not in the total " +
          "above."
      )
    );
    nodes.push(
      table(
        "Token volumes (copilot) — no dollars",
        [
          { label: "Model", name: true },
          { label: "Messages", figure: true },
          { label: "Output tokens", figure: true },
        ],
        cost.copilot.rows.map((row) => [
          row.model === null ? "(no model recorded)" : row.model,
          row.messages,
          row.output_rendered,
        ])
      )
    );
  }

  for (const entry of cost.sessions.no_signal) {
    nodes.push(
      el(
        "p",
        "note",
        entry.sessions +
          " " +
          entry.source_agent +
          " sessions recorded no per-message usage at all, so nothing about their cost can be read" +
          " at any price."
      )
    );
  }

  const flagged = cost.flagged;
  if (flagged.any) {
    nodes.push(el("p", "note", "Unpriced and flagged — tokens the archive recorded that this build did not turn into dollars. None of it is estimated, interpolated, or rounded into the total above."));
    const list = el("ul", "flags");
    if (flagged.synthetic) {
      list.appendChild(
        el(
          "li",
          null,
          "Unbilled (synthetic) — " +
            flagged.synthetic.messages +
            " messages, " +
            flagged.synthetic.tokens.total.rendered +
            " tokens. Claude Code's placeholder for messages it generated locally; no vendor" +
            " billed them."
        )
      );
    }
    for (const unpriced of flagged.unpriced) {
      list.appendChild(
        el(
          "li",
          null,
          "Unpriced — " +
            unpriced.messages +
            " messages, " +
            unpriced.tokens.total.rendered +
            " tokens: " +
            unpriced.detail +
            "."
        )
      );
    }
    if (flagged.untiered_cache_writes) {
      list.appendChild(
        el(
          "li",
          null,
          "Cache writes with no tier — " +
            flagged.untiered_cache_writes.rendered +
            " tokens across " +
            flagged.untiered_cache_writes.messages +
            " messages stated only as a total. The two tiers bill at different multiples of" +
            " input, so such a write has no rate and is left out rather than charged at an" +
            " assumed one."
        )
      );
    }
    if (flagged.undeduplicatable) {
      list.appendChild(
        el(
          "li",
          null,
          "Undeduplicatable usage — " +
            flagged.undeduplicatable.records +
            " records carrying " +
            flagged.undeduplicatable.rendered +
            " tokens were summed per record, so this share of the total may be counted more than" +
            " once. Over-counting rather than dropping real spend, and named either way."
        )
      );
    }
    nodes.push(list);
  }

  /* Small sessions at the top price tier: the same reading the document renders, and the
     same refusal to draw a conclusion from it. Nothing here scores or ranks — the archive
     records what a session cost and how much it wrote, never what it was worth. */
  const premium = cost.premium;
  if (premium.any) {
    nodes.push(
      el(
        "p",
        "note",
        premium.totals.sessions +
          " of the " +
          premium.sessions +
          " sessions priced wholly at the dearest rate the price table held on the day the" +
          " archive took them billed at most " +
          premium.floors.max_messages +
          " messages and produced at most " +
          premium.floors.max_output_tokens_rendered +
          " output tokens. " +
          (premium.totals.sessions === 1 ? "That session cost " : "Together they cost ") +
          premium.totals.dollars_rendered +
          " — dollars already inside the total above and inside their model's row in it, not" +
          " beside them. This is an observation about spend and not a score: nothing here says a" +
          " cheaper model would have done, and both floors are arbitrary-until-measured constants."
      )
    );
    nodes.push(
      table(
        "Small sessions at the top price tier",
        [
          { label: "Archived", name: true },
          { label: "Model", name: true },
          { label: "Messages", figure: true },
          { label: "Output", figure: true },
          { label: "Cost", figure: true },
          { label: "Session", name: true },
        ],
        premium.rows.map((row) => [
          row.archived_at === null ? "an unreadable time" : row.archived_at,
          row.models.join(", "),
          row.messages,
          row.output_rendered,
          row.dollars_rendered,
          row.source_hash,
        ])
      )
    );
    if (premium.rows_hidden) {
      nodes.push(
        el(
          "p",
          "note",
          premium.rows_hidden +
            (premium.rows_hidden === 1
              ? " further session under the same floors is not shown; "
              : " further sessions under the same floors are not shown; ") +
            "the totals above count every one of them."
        )
      );
    }
  }

  if (cost.duplicate_records) {
    nodes.push(
      el(
        "p",
        "note",
        "Deduplication dropped " +
          cost.duplicate_records +
          " further records that repeated a message already counted: one API message reaches a" +
          " transcript as several records repeating its usage verbatim, so summing records would" +
          " have inflated every figure above."
      )
    );
  }
  for (const gap of cost.gaps) {
    nodes.push(el("p", "note", "Gap — " + gap.count + " — " + gap.reason));
  }
  return nodes;
}

/* The standup. Every string here came out of the fold already scrubbed, and the
   redaction markers are rendered exactly as they arrived: a reader has to be able to
   see that the scrub fired, so a marker is shown rather than tidied away. */
function standupSession(session) {
  const card = el("div", "session-card");
  card.appendChild(el("h4", null, session.title));
  const meta = [
    "archived " + (session.archived_at || "at an unreadable time") + " (UTC)",
    session.branch ? "branch " + session.branch : null,
    "sha256:" + session.source_hash,
  ]
    .filter(Boolean)
    .join(" · ");
  card.appendChild(el("div", "session-meta", meta));
  card.appendChild(el("p", "session-goal", session.goal));
  const work = el("ul", "work");
  if (session.work_completed.length) {
    for (const item of session.work_completed) work.appendChild(el("li", null, item));
  } else {
    work.appendChild(el("li", null, "(this session's summary lists no completed work)"));
  }
  card.appendChild(work);
  return card;
}

function rollup(heading, lines, note) {
  const nodes = [el("p", "headline-sub", heading)];
  if (!lines.length) {
    nodes.push(el("p", "empty", "No session in this window recorded any under this heading."));
    return nodes;
  }
  const list = el("ul", "rollup");
  for (const line of lines) {
    const item = el("li", null, line.text + " ");
    item.appendChild(el("span", "where", line.repository));
    list.appendChild(item);
  }
  nodes.push(list);
  nodes.push(el("p", "note", note));
  return nodes;
}

/* The narrative for one repository.
 *
 * The standup groups by the repository each session's own `summary.md` names, while the
 * scope list is Patwari's projection onto the snapshot the session was listed by. They
 * agree on ordinary sessions and are allowed to disagree, and the windows differ too —
 * the narrative covers a week and the scores a month. So a scope with nothing here is a
 * real answer and the page says which of those it is, rather than rendering an empty
 * section and letting a reader conclude nothing happened.
 */
function scopedStandupSection(standup, repository) {
  const nodes = [];
  const groups = standup.repositories.filter((group) => group.repository === repository);
  const sessions = groups.reduce((total, group) => total + group.sessions.length, 0);
  if (sessions === 0) {
    nodes.push(
      el(
        "p",
        "empty",
        "No summary in the last " +
          standup.window.last +
          " named " +
          repository +
          ". The standup groups by the repository each session's own summary states, which is a " +
          "different fact from the repository the archive listed the session under — and it covers " +
          "a shorter window than the scores above."
      )
    );
  } else {
    nodes.push(
      el(
        "p",
        "headline-sub",
        sessions +
          " sessions in " +
          repository +
          ", archived since " +
          standup.window.opens_at +
          " (UTC) — narrated from the summaries munshi wrote when it captured them. No model" +
          " reconstructed any of this."
      )
    );
    for (const group of groups) {
      const repo = el("div", "repo");
      for (const session of group.sessions) repo.appendChild(standupSession(session));
      nodes.push(repo);
    }
  }
  const attributed = (lines) => lines.filter((line) => line.repository === repository);
  nodes.push(
    ...rollup(
      "Decisions",
      attributed(standup.decisions),
      "These are the decisions the sessions themselves recorded, in reading order, with exact" +
        " repeats within a repository dropped."
    )
  );
  nodes.push(
    ...rollup(
      "Open items",
      attributed(standup.open_items),
      "These are the open items the sessions themselves recorded — what was still owed when each" +
        " capture ended, not a live task list."
    )
  );
  nodes.push(
    el(
      "p",
      "note",
      "Gaps are window-wide: a session with no summary at all cannot be attributed to a" +
        " repository, so it is counted for the window and not under one. Clear the scope to read" +
        " them."
    )
  );
  return nodes;
}

function standupSection(standup) {
  const nodes = [];
  if (standup.sessions === 0) {
    nodes.push(
      el(
        "p",
        "empty",
        "No archived session in the last " +
          standup.window.last +
          " carried a summary to narrate. Anything the archive did hold is below."
      )
    );
  } else {
    nodes.push(
      el(
        "p",
        "headline-sub",
        standup.sessions +
          " sessions across " +
          standup.repositories_narrated +
          (standup.repositories_narrated === 1 ? " repository" : " repositories") +
          ", archived since " +
          standup.window.opens_at +
          " (UTC) — narrated from the summaries munshi wrote when it captured them. No model" +
          " reconstructed any of this."
      )
    );
    for (const group of standup.repositories) {
      const repo = el("div", "repo");
      repo.appendChild(el("h3", null, group.repository));
      for (const session of group.sessions) repo.appendChild(standupSession(session));
      nodes.push(repo);
    }
  }

  nodes.push(
    ...rollup(
      "Decisions",
      standup.decisions,
      "These are the decisions the sessions themselves recorded, in reading order, with exact" +
        " repeats within a repository dropped."
    )
  );
  nodes.push(
    ...rollup(
      "Open items",
      standup.open_items,
      "These are the open items the sessions themselves recorded — what was still owed when each" +
        " capture ended, not a live task list."
    )
  );

  if (standup.gaps.length) {
    nodes.push(el("p", "headline-sub", "Gaps"));
    const list = el("ul", "flags");
    for (const gap of standup.gaps) {
      list.appendChild(el("li", null, gap.count + " — " + gap.reason));
    }
    nodes.push(list);
  }
  return nodes;
}

/* What the scrub did to the prose above, in the document that carries it. A reader
   looking at an unmarked standup needs to know whether that means "nothing matched"
   or "the scrub was off", and those are very different sentences. */
function standupScrubNote(standup, redaction) {
  if (!redaction.secrets) {
    return (
      "The prose above is SERVED RAW: this dashboard was started with --no-redact, so nothing in" +
      " it was scrubbed for secrets."
    );
  }
  const fired = standup.redaction.total
    ? standup.redaction.total +
      " replacements were made (" +
      standup.redaction.fired.map((entry) => entry.pattern + " ×" + entry.count).join(", ") +
      ")"
    : "Nothing matched";
  return (
    "Every line of prose above came out of the archive and was scrubbed for secrets before it was" +
    " rendered, against pattern set " +
    redaction.pattern_revision +
    ". " +
    fired +
    ". What a pattern matched is never recorded, printed, or counted per value — only that it" +
    " fired."
  );
}

/* ------------------------------------------------------------------------ *
 * The timeline: the coaching window on a calendar.
 *
 * One chart, one axis. The two measures — sessions a day and active hours a day —
 * are a *toggle* and never two scales on one plot: aligning two y-axes is an
 * arbitrary choice that invents a correlation the data does not contain.
 *
 * Every number drawn here was computed in Rust and arrives as an integer. This file
 * scales it into pixels and labels an axis; it counts nothing, sums nothing across
 * days that the payload did not already sum, and re-renders no duration that
 * `format.rs` renders. The chart's own unit is decimal hours, because a bar's height
 * is a quantity and `2h 10m` is prose.
 *
 * A day is the UTC calendar day of the session's *archive completion* time — see the
 * note under the chart, which says so on the page rather than only here.
 * ------------------------------------------------------------------------ */

const TIMELINE = {
  padLeft: 46,
  padRight: 10,
  padTop: 14,
  padBottom: 34,
  plotHeight: 150,
  /* The narrowest slot a day gets, the widest, and the air left around the bar
     inside it. A bar that filled its slot would touch its neighbours, and the gap
     is what separates touching marks here — never a stroke, which would add ink
     that is not data. The bar is capped as well as floored: past 24px a column
     stops reading as a mark and starts reading as a block. */
  slot: 18,
  widestSlot: 48,
  slotAir: 4,
  widestBar: 24,
  /* A chart of three days should not be three bars huddled at the left of an empty
     box, so the slot grows until the plot is at least this wide. */
  leastPlot: 320,
  /* The surface gap between stacked segments, and the rounded data-end on the top of
     a column. The baseline end stays square. */
  gap: 2,
  radius: 4,
};

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* An ISO day read as characters, and deliberately never handed to `Date`.
   `new Date("2026-08-11")` is UTC midnight and every way of printing it back is in
   the reader's own zone, so a browser in Auckland would relabel each bar as the day
   after. Re-expressing a UTC day as a local one is the exact confusion this view is
   at pains to avoid, and it is why the 7×24 heatmap is not on this page at all. */
function dayLabel(iso) {
  return MONTHS[Number(iso.slice(5, 7)) - 1] + " " + iso.slice(8, 10);
}

/* The chart's own unit for active time. Decimal hours, because the axis is scaled in
   them; `format.rs` stays the one place a duration is rendered as prose. */
function activeHours(seconds) {
  return (seconds / 3600).toFixed(1);
}

/* Which measure the chart is drawing. Module state rather than storage: it is a
   glance, not a preference, and it survives an SSE refresh because `paint` reads it
   rather than resetting it. */
let measure = "sessions";

/* The series to draw: one per harness in the payload's own axis, or exactly the one a
   harness scope picked.
 *
 * The colour slot is the harness's index in that axis and nothing else — never its
 * position among the survivors of a filter. A reader who learned which colour
 * claude-code is keeps it in every scope. */
function timelineSeries(data, column) {
  return data.scopes.harnesses
    .map((label, index) => ({ label, index, klass: index < 3 ? "s" + index : "sx" }))
    .filter((series) => column < 0 || series.index === column);
}

/* Both halves of the window pair as one left-to-right run of columns: the comparison
   window's days first, then the reported window's.
 *
 * They stay separate columns rather than being merged by date because a window opens
 * at an instant and not at midnight, so one calendar day can hold sessions from both
 * halves. Merging them would put the boundary at the nearest midnight, which is not
 * where it is. */
function timelineColumns(timeline, series) {
  const half = (days, reported) =>
    days.map((day) => {
      const parts = series.map((entry) => ({
        series: entry,
        sessions: day.sessions[entry.index] || 0,
        seconds: day.active_seconds[entry.index] || 0,
      }));
      return {
        date: day.date,
        reported,
        parts,
        sessions: parts.reduce((total, part) => total + part.sessions, 0),
        seconds: parts.reduce((total, part) => total + part.seconds, 0),
      };
    });
  return half(timeline.comparison_days, false).concat(half(timeline.days, true));
}

function partValue(part) {
  return measure === "sessions" ? part.sessions : part.seconds / 3600;
}

function columnValue(column) {
  return measure === "sessions" ? column.sessions : column.seconds / 3600;
}

/* A round number at or above the tallest column: 1, 2, 5 and their powers of ten.
   Axis ticks carry the values no bar is directly labelled with, so they have to be
   numbers a reader can hold. */
function niceMax(value) {
  if (!(value > 0)) return 1;
  const power = Math.pow(10, Math.floor(Math.log10(value)));
  for (const step of [1, 2, 5]) {
    if (value <= step * power) return step * power;
  }
  return 10 * power;
}

/* Zero, the top, and the midpoint when the midpoint is a number worth printing. A
   session count of 2.5 is not one, so a session axis whose top is odd gets two ticks
   rather than a fractional one. */
function timelineTicks(max) {
  const middle = max / 2;
  if (measure === "sessions" && !Number.isInteger(middle)) return [0, max];
  return [0, middle, max];
}

function tickLabel(value) {
  if (measure === "sessions") return String(value);
  /* A whole number of hours reads as one: "500h", not "500.0h". The decimal is
     there for an axis whose top is under ten, where it is the only thing telling
     two ticks apart. */
  return (Number.isInteger(value) ? String(value) : value.toFixed(1)) + "h";
}

/* How wide a day's slot is, and the bar inside it.
 *
 * Fixed at the floor for a long window, widened for a short one so a scope worked on
 * three days is a chart rather than three bars in the corner of an empty box. The bar
 * is capped at the mark spec's ceiling however wide the slot gets. */
function slotWidth(count) {
  if (!count) return TIMELINE.slot;
  const room = Math.floor(TIMELINE.leastPlot / count);
  return Math.max(TIMELINE.slot, Math.min(TIMELINE.widestSlot, room));
}

function barWidth(slot) {
  return Math.min(TIMELINE.widestBar, slot - TIMELINE.slotAir);
}

/* How many slots apart date labels may stand.
 *
 * Measured against the slot rather than fixed, because the point is that two labels
 * must not overlap: `Aug 12` is about 40px, so a chart of 18px slots labels every
 * third day and one of 48px slots labels every other. Labelling every column was the
 * obvious first answer and it is wrong — at any real slot width the dates run
 * together into a smear, which is worse than an unlabelled bar the tooltip and the
 * table both name. */
function labelStride(slot) {
  return Math.max(1, Math.ceil(46 / slot));
}

/* A column with a square baseline and a rounded data-end. The radius is clamped
   against the bar's own width and height, so a one-pixel bar is a one-pixel bar
   rather than a smear. */
function barPath(x, y, width, height, radius) {
  const r = Math.max(0, Math.min(radius, width / 2, height));
  return (
    "M" + x + " " + (y + height) +
    " V" + (y + r) +
    " A" + r + " " + r + " 0 0 1 " + (x + r) + " " + y +
    " H" + (x + width - r) +
    " A" + r + " " + r + " 0 0 1 " + (x + width) + " " + (y + r) +
    " V" + (y + height) +
    " Z"
  );
}

/* What one column says when a reader points at it: the day, which half of the pair it
   is in, both measures, and the harnesses inside it. Set as text on an SVG <title>,
   which is the accessible name of the group as well as its tooltip — one mechanism
   doing both jobs, and no markup parsed anywhere. */
function columnTitle(column) {
  const parts = [
    column.date,
    column.reported ? "reported window" : "comparison window",
    column.sessions + (column.sessions === 1 ? " session" : " sessions"),
    activeHours(column.seconds) + "h active",
  ];
  for (const part of column.parts) {
    if (!part.sessions) continue;
    parts.push(part.series.label + " " + part.sessions + " · " + activeHours(part.seconds) + "h");
  }
  return parts.join(" · ");
}

/* The chart itself. Built into the <svg> the document already carries, so the SVG
   namespace is read off a real element rather than written down as a URL in this
   file — see the comment on the element. */
function drawTimeline(columns, series) {
  const chart = document.getElementById("timeline-chart");
  const ns = chart.namespaceURI;
  const shape = (tag, className) => {
    const node = document.createElementNS(ns, tag);
    if (className) node.setAttribute("class", className);
    return node;
  };
  const set = (node, attributes) => {
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, String(value));
    return node;
  };

  const slot = slotWidth(columns.length);
  const bar = barWidth(slot);
  const width = TIMELINE.padLeft + columns.length * slot + TIMELINE.padRight;
  const height = TIMELINE.padTop + TIMELINE.plotHeight + TIMELINE.padBottom;
  const base = TIMELINE.padTop + TIMELINE.plotHeight;
  set(chart, { width, height, viewBox: "0 0 " + width + " " + height });

  const title = document.getElementById("timeline-title");
  const desc = document.getElementById("timeline-desc");
  title.textContent =
    measure === "sessions"
      ? "Sessions archived per day"
      : "Active hours per day (summed across sessions — concurrent sessions can exceed 24h)";
  desc.textContent = columns.length
    ? "A stacked column per day over " +
      columns.length +
      " days, split by harness, on the UTC day each session's archive snapshot completed. The" +
      " same numbers are in the table below."
    : "No day in this window has a session on it.";

  const nodes = [];
  if (!columns.length) {
    chart.replaceChildren(title, desc);
    return;
  }

  const max = niceMax(Math.max(...columns.map(columnValue)));
  /* Gridlines before direct labels, and hairline solid rather than dashed: the grid
     carries the values no bar is labelled with and must stay recessive while it does
     it. */
  for (const tick of timelineTicks(max)) {
    const y = base - (tick / max) * TIMELINE.plotHeight;
    nodes.push(
      set(shape("line", "grid"), {
        x1: TIMELINE.padLeft,
        y1: y,
        x2: width - TIMELINE.padRight,
        y2: y,
      })
    );
    const label = shape("text", "axis-text");
    set(label, { x: TIMELINE.padLeft - 6, y: y + 3, "text-anchor": "end" });
    label.textContent = tickLabel(tick);
    nodes.push(label);
  }

  columns.forEach((column, index) => {
    const slotX = TIMELINE.padLeft + index * slot;
    const group = shape("g");
    const label = shape("title");
    label.textContent = columnTitle(column);
    group.appendChild(label);
    /* The hit target is the whole slot, full height — bigger than the mark, so a
       one-session day is as easy to point at as a busy one. */
    group.appendChild(
      set(shape("rect", "hit"), {
        x: slotX,
        y: TIMELINE.padTop,
        width: slot,
        height: TIMELINE.plotHeight,
      })
    );

    const drawn = column.parts.filter((part) => partValue(part) > 0);
    let cursor = base;
    drawn.forEach((part, at) => {
      const span = (partValue(part) / max) * TIMELINE.plotHeight;
      /* The 2px surface gap goes on the top of every segment but the topmost, which
         is where the rounded data-end goes instead. */
      const top = at === drawn.length - 1;
      const trim = top ? 0 : TIMELINE.gap;
      /* Anchored at the bottom of its band and never below it: a segment thinner
         than the gap keeps one drawn pixel rather than being trimmed past the
         baseline into a rectangle with a negative height. */
      const tall = Math.max(span - trim, 1);
      const y = cursor - tall;
      const x = slotX + (slot - bar) / 2;
      if (top) {
        group.appendChild(
          set(shape("path", part.series.klass), { d: barPath(x, y, bar, tall, TIMELINE.radius) })
        );
      } else {
        group.appendChild(
          set(shape("rect", part.series.klass), { x, y, width: bar, height: tall })
        );
      }
      cursor -= span;
    });
    nodes.push(group);
  });

  /* Where the reported window opens. It is drawn at the edge between the two halves
     rather than at a midnight, because that is where it is: a window opens at an
     instant, which is why a day can appear on both sides of this line. */
  const opens = columns.findIndex((column) => column.reported);
  if (opens > 0) {
    const x = TIMELINE.padLeft + opens * slot - TIMELINE.gap / 2;
    nodes.push(set(shape("line", "boundary"), { x1: x, y1: TIMELINE.padTop, x2: x, y2: base }));
    const marker = shape("text", "axis-text");
    set(marker, { x: x + 4, y: TIMELINE.padTop + 8 });
    marker.textContent = "window opens";
    nodes.push(marker);
  }

  nodes.push(
    set(shape("line", "grid"), {
      x1: TIMELINE.padLeft,
      y1: base,
      x2: width - TIMELINE.padRight,
      y2: base,
    })
  );

  /* Date labels are selective, and spaced by how wide a label is rather than by a
     count: the first day, the last, the boundary between the two windows, and then
     every `stride`th in between, dropping any that would land on top of the last.
     The axis is not where the numbers are — the tooltip and the table both carry
     every value — so a legible handful of dates beats a smear of all of them. */
  const stride = labelStride(slot);
  const last = columns.length - 1;
  /* The two ends are placed first and always; then the boundary, then the strided
     candidates in order, each taken only if it clears every label already placed.
     A candidate that would land beside the boundary is the case that made this a
     greedy walk rather than a set — a forced label and a strided one an index apart
     print on top of each other, and the result is unreadable in exactly the place a
     reader most wants a date. */
  // A one-day chart has last === 0: seed once, not twice, or the date prints over itself.
  const placed = [...new Set([0, last])];
  const wanted = opens > 0 ? [opens] : [];
  for (let index = stride; index < last; index += stride) wanted.push(index);
  for (const index of wanted) {
    if (placed.every((at) => Math.abs(at - index) >= stride)) placed.push(index);
  }
  for (const index of placed.sort((left, right) => left - right)) {
    const text = shape("text", "axis-text");
    const anchor = index === 0 ? "start" : index === last ? "end" : "middle";
    const at =
      TIMELINE.padLeft +
      index * slot +
      (anchor === "start" ? 0 : anchor === "end" ? slot : slot / 2);
    set(text, { x: at, y: base + 16, "text-anchor": anchor });
    text.textContent = dayLabel(columns[index].date);
    nodes.push(text);
  }

  chart.replaceChildren(title, desc, ...nodes);
}

/* The legend. Present whenever there is more than one series, because identity must
   never rest on colour alone; absent for a single one, where the heading above
   already names what is drawn. */
function drawTimelineLegend(series) {
  const legend = document.getElementById("timeline-legend");
  if (series.length < 2) {
    legend.replaceChildren();
    return;
  }
  legend.replaceChildren(
    ...series.map((entry) => {
      const item = el("div", "legend-item");
      /* The swatch wears the series colour and the label beside it wears text ink —
         a light categorical hue is illegible as text, and identity belongs to the
         mark next to the words rather than to the words. Both colours come from the
         stylesheet's own classes, so the legend and the bars cannot drift. */
      item.appendChild(el("span", "legend-swatch " + entry.klass));
      item.appendChild(el("span", null, entry.label));
      return item;
    })
  );
}

/* The same numbers as a table, behind a disclosure. It is not an afterthought: it is
   what makes the chart legible to a reader whose colour vision, screen, or print-out
   cannot separate two series, and it is what the light-mode palette's one low-contrast
   slot is allowed on condition of. */
function timelineTable(columns, series) {
  const heading = [
    { label: "Day" },
    { label: "Window" },
    ...series.map((entry) => ({ label: entry.label, figure: true })),
    { label: "Total", figure: true },
  ];
  /* The measure has already been applied — a count, or hours. This only writes it. */
  const cell = (value) => (measure === "sessions" ? String(value) : value.toFixed(1) + "h");
  const rows = columns.map((column) => [
    column.date,
    column.reported ? "reported" : "comparison",
    ...column.parts.map((part) => cell(partValue(part))),
    cell(columnValue(column)),
  ]);
  const details = el("details");
  details.appendChild(el("summary", null, "The numbers behind the chart"));
  details.appendChild(table(null, heading, rows));
  return details;
}

function timelineNote(data, timeline, columns) {
  /* "16 days of the last 15d" is a sentence that reads like a mistake and is not one:
     a window is a rolling span of hours counted back from the refresh, so it straddles
     one more calendar day than it is long whenever it does not start at midnight. The
     span is named separately from the count, and the reason is stated, rather than
     leaving a reader to decide the page cannot add up. */
  const covered =
    "Sessions landed on " +
    timeline.days_covered +
    (timeline.days_covered === 1 ? " UTC day" : " UTC days") +
    (timeline.comparison_days_covered
      ? ", and on " + timeline.comparison_days_covered + " in the window before it"
      : "") +
    ". The window is the last " +
    data.window.last +
    " counted back from the refresh, so it can straddle one more calendar day than it is long. ";
  const basis =
    "A day is the UTC calendar day the archive finished the session's snapshot — archive time, not" +
    " the transcript's own clock and not the reader's local one. It is the clock the window itself" +
    " was cut on, which is why the bars add up to the session count above. Local time is not in" +
    " the archive yet, so there is no hour-of-day or day-of-week view here: those are the claims a" +
    " missing offset misplaces.";
  const undated = timeline.undated
    ? " " + timeline.undated + " session in this window carries no readable archive time and is on no bar."
    : "";
  const empty = columns.length ? "" : " Nothing to draw in this scope.";
  return covered + basis + undated + empty;
}

function paintTimeline(data, entry, column) {
  const timeline = entry ? entry.timeline : data.timeline;
  const series = timelineSeries(data, column);
  const columns = timelineColumns(timeline, series);
  drawTimelineLegend(series);
  drawTimeline(columns, series);
  document.getElementById("timeline-note").textContent = timelineNote(data, timeline, columns);
  document
    .getElementById("timeline-table")
    .replaceChildren(...(columns.length ? [timelineTable(columns, series)] : []));
}

/* ------------------------------------------------------------------------
 * The habits heatmap: the same fold on the operator's own clock.
 *
